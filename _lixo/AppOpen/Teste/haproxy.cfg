global
    log stdout format raw local0

defaults
    log     global
    mode    tcp
    timeout client 30s
    timeout server 30s
    timeout connect 5s

frontend udp_gateway
    bind *:7000
    default_backend node_backends

backend node_backends
    balance roundrobin
    timeout connect 5s
    timeout server 30s
    server node1 app_1:41234
    server node2 app_2:41234
    server node3 app_3:41234