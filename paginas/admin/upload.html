<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gerenciador de Arquivos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/show-hint.min.css">
   
       <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css">

       <!--Tailwind-->
       <script src="https://cdn.tailwindcss.com"></script>
   <style>
        :root {
            --bg-app: #F3F4F1;
            --bg-panel: #FFFFFF;
            --bg-sidebar: #EBECE7;
            --bg-sidebar-hover: #DEE0DA;
            --border: #DCDDD6;
            --ink: #1C201D;
            --muted: #6D746D;
            --accent: #2B6F62;
            --accent-dark: #215A50;
            --accent-soft: #DCEAE6;
            --danger: #B23B2E;
            --danger-soft: #F5E2DF;
            --folder: #C99A4B;
            --font-sans: 'IBM Plex Sans', system-ui, sans-serif;
            --font-mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', monospace;
        }

        /* Garante que o atributo hidden vença as regras de display abaixo */
        [hidden] {
            display: none !important;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            margin: 0;
        }

        body {
            font-family: var(--font-sans);
            color: var(--ink);
            background: var(--bg-app);
        }

        button,
        input {
            font-family: inherit;
            color: inherit;
        }

        button {
            cursor: pointer;
        }

        svg {
            display: block;
        }

        .app {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* ---------- Topbar ---------- */
        .topbar {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 10px 18px;
            background: var(--bg-panel);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            font-size: 14.5px;
            flex-shrink: 0;
        }

        .brand svg {
            width: 18px;
            height: 18px;
            color: var(--accent);
        }

        .breadcrumbs {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 2px;
            font-family: var(--font-mono);
            font-size: 13px;
            color: var(--muted);
            overflow-x: auto;
            white-space: nowrap;
            min-width: 0;
        }

        .breadcrumbs::-webkit-scrollbar {
            height: 0;
        }

        .breadcrumbs button {
            background: none;
            border: none;
            color: var(--muted);
            padding: 4px 6px;
            border-radius: 5px;
            font-family: inherit;
            font-size: inherit;
        }

        .breadcrumbs button:hover {
            background: var(--accent-soft);
            color: var(--accent);
        }

        .breadcrumbs button.current {
            color: var(--ink);
            font-weight: 600;
        }

        .breadcrumbs .sep {
            color: var(--border);
            padding: 0 1px;
        }

        .topbar-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .search {
            font-size: 13px;
            padding: 7px 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--bg-app);
            width: 170px;
        }

        .search:focus-visible {
            outline: 2px solid var(--accent-soft);
            outline-offset: 1px;
            border-color: var(--accent);
        }

        .icon-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            border-radius: 6px;
            border: 1px solid transparent;
            background: none;
            color: var(--muted);
        }

        .icon-btn:hover {
            background: var(--accent-soft);
            color: var(--accent-dark);
        }

        .icon-btn:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 1px;
        }

        .icon-btn:disabled {
            opacity: .5;
            cursor: default;
        }

        .icon-btn svg {
            width: 16.5px;
            height: 16.5px;
        }

        .icon-btn.danger:hover {
            background: var(--danger-soft);
            color: var(--danger);
        }

        /* ---------- Body layout ---------- */
        .body {
            flex: 1;
            display: flex;
            min-height: 0;
        }

        .sidebar {
            width: 250px;
            flex-shrink: 0;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .side-section {
            border-bottom: 1px solid var(--border);
        }

        .side-section:last-child {
            border-bottom: none;
        }

        .side-header {
            display: flex;
            align-items: center;
            gap: 6px;
            width: 100%;
            padding: 11px 14px;
            font-size: 12px;
            font-weight: 600;
            color: var(--muted);
            background: none;
            border: none;
            text-align: left;
        }

        .tree-scroll {
            padding: 0 8px 12px;
            font-size: 13.5px;
            max-height: 340px;
            overflow-y: auto;
        }

        ul.tree,
        ul.tree ul {
            list-style: none;
            margin: 0;
            padding-left: 14px;
        }

        ul.tree {
            padding-left: 0;
        }

        .folder-row {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 5px 7px;
            border-radius: 6px;
            color: var(--ink);
            min-width: 0;
            cursor: pointer;
        }

        .folder-row:hover {
            background: var(--bg-sidebar-hover);
        }

        .folder-row.selected {
            background: var(--accent);
            color: #fff;
        }

        .folder-row .caret {
            width: 10px;
            height: 10px;
            flex-shrink: 0;
            color: var(--muted);
            transition: transform .15s ease;
        }

        .folder-row .caret.spacer {
            visibility: hidden;
        }

        .folder-row .caret.open {
            transform: rotate(90deg);
        }

        .folder-row.selected .caret {
            color: #fff;
        }

        .folder-row .folder-icon {
            width: 14px;
            height: 14px;
            flex-shrink: 0;
            color: var(--folder);
        }

        .folder-row.selected .folder-icon {
            color: #fff;
        }

        .folder-row .flabel {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .nested {
            display: none;
        }

        .nested.active {
            display: block;
        }

        .field-row {
            display: flex;
            gap: 6px;
        }

        .field-row input {
            flex: 1;
            min-width: 0;
            font-family: var(--font-mono);
            font-size: 12.5px;
            padding: 6px 8px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--bg-panel);
        }

        .git-output {
            margin: 0;
            font-family: var(--font-mono);
            font-size: 11.5px;
            line-height: 1.6;
            color: var(--muted);
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 8px;
            max-height: 120px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-word;
        }

        /* ---------- Content ---------- */
        .content {
            flex: 1;
            position: relative;
            overflow-y: auto;
            padding: 18px 22px 8px;
        }

        .inline-row {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-bottom: 16px;
        }

        .inline-row input {
            font-family: var(--font-mono);
            font-size: 13px;
            padding: 7px 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            flex: 0 0 240px;
            background: var(--bg-panel);
        }

        .btn-primary-sm {
            font-size: 13px;
            font-weight: 600;
            padding: 7px 14px;
            border-radius: 6px;
            border: none;
            background: var(--accent);
            color: #fff;
        }

        .btn-primary-sm:hover {
            background: var(--accent-dark);
        }

        .btn-ghost-sm {
            font-size: 13px;
            padding: 7px 12px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: none;
            color: var(--muted);
        }

        .btn-ghost-sm:hover {
            color: var(--ink);
            border-color: var(--ink);
        }

        .empty-state {
            padding: 70px 0;
            text-align: center;
            color: var(--muted);
        }

        .empty-state p {
            margin: 0 0 4px;
            font-size: 14px;
        }

        .empty-state .muted {
            font-size: 12.5px;
        }

        .file-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13.5px;
        }

        .file-table thead th {
            text-align: left;
            font-weight: 600;
            color: var(--muted);
            font-size: 11.5px;
            padding: 6px 10px;
            border-bottom: 1px solid var(--border);
        }

        .file-table tbody tr {
            border-bottom: 1px solid var(--border);
        }

        .file-table tbody tr:hover {
            background: var(--bg-panel);
        }

        .file-table td {
            padding: 7px 10px;
            vertical-align: middle;
        }

        .file-icon-col {
            width: 38px;
        }

        .file-thumb {
            width: 26px;
            height: 26px;
            object-fit: cover;
            border-radius: 4px;
            border: 1px solid var(--border);
        }

        .file-badge {
            width: 26px;
            height: 26px;
            border-radius: 4px;
            background: var(--bg-sidebar);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 8.5px;
            font-weight: 700;
            color: var(--muted);
            font-family: var(--font-mono);
            text-transform: uppercase;
        }

        .file-name {
            font-family: var(--font-mono);
            font-size: 13px;
            color: var(--ink);
        }

        .file-type {
            color: var(--muted);
            font-size: 11.5px;
            font-family: var(--font-mono);
        }

        .file-actions {
            display: flex;
            gap: 1px;
            justify-content: flex-end;
        }

        .drop-overlay {
            position: absolute;
            inset: 10px;
            background: rgba(43, 111, 98, .06);
            border: 2px dashed var(--accent);
            border-radius: 8px;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 4px;
            font-size: 14.5px;
            font-weight: 600;
            color: var(--accent-dark);
            pointer-events: none;
            text-align: center;
        }

        .content.dragging .drop-overlay {
            display: flex;
        }

        .drop-overlay strong {
            font-family: var(--font-mono);
            font-weight: 600;
        }

        /* ---------- Status bar ---------- */
        .statusbar {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 8px 18px;
            border-top: 1px solid var(--border);
            background: var(--bg-panel);
            font-size: 12.5px;
            color: var(--muted);
            flex-shrink: 0;
        }

        .progress-wrap {
            width: 150px;
            height: 6px;
            border-radius: 3px;
            background: var(--border);
            overflow: hidden;
            flex-shrink: 0;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: var(--accent);
            transition: width .2s ease;
        }

        .progress-bar.error {
            background: var(--danger);
        }

        .status-msg {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* ---------- Modal ---------- */
        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(20, 22, 20, .5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 50;
            padding: 24px;
        }

        .modal-backdrop.open {
            display: flex;
        }

        .modal {
            background: var(--bg-panel);
            border-radius: 8px;
            width: 880px;
            max-width: 100%;
            box-shadow: 0 24px 60px rgba(0, 0, 0, .28);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .modal-header {
            padding: 14px 18px;
            border-bottom: 1px solid var(--border);
            font-family: var(--font-mono);
            font-size: 13px;
            font-weight: 600;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .modal-footer {
            padding: 12px 18px;
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            border-top: 1px solid var(--border);
        }

        .CodeMirror {
            height: min(60vh, 460px);
            font-size: 13.5px;
            font-family: var(--font-mono);
        }

        /* ---------- Modal de operações (PM2 / Git) ---------- */
        .ops-modal {
            width: 760px;
        }

        .ops-body {
            padding: 14px 18px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 70vh;
            overflow-y: auto;
            font-size: 13.5px;
        }

        .ops-toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .ops-toolbar button {
            white-space: nowrap;
        }

        .ops-section-title {
            font-size: 12px;
            font-weight: 600;
            color: var(--muted);
            margin-top: 4px;
        }

        .ops-block {
            max-height: 180px;
            margin: 0;
        }

        .ops-log {
            max-height: 130px;
            margin: 0;
        }

        .ops-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        .ops-table th {
            text-align: left;
            font-size: 11.5px;
            color: var(--muted);
            padding: 6px 8px;
            border-bottom: 1px solid var(--border);
        }

        .ops-table td {
            padding: 7px 8px;
            border-bottom: 1px solid var(--border);
            font-family: var(--font-mono);
            font-size: 12.5px;
        }

        .ops-actions {
            display: flex;
            gap: 6px;
            justify-content: flex-end;
        }

        .ops-actions button {
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 5px;
            border: 1px solid var(--border);
            background: var(--bg-panel);
        }

        .ops-actions button:hover {
            border-color: var(--accent);
            color: var(--accent-dark);
        }

        .ops-actions button.danger-btn:hover {
            border-color: var(--danger);
            color: var(--danger);
        }

        .st {
            font-size: 11.5px;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 10px;
        }

        .st-online {
            background: var(--accent-soft);
            color: var(--accent-dark);
        }

        .st-stopped {
            background: var(--bg-sidebar-hover);
            color: var(--muted);
        }

        .st-error {
            background: var(--danger-soft);
            color: var(--danger);
        }

        .st-other {
            background: #F5EFD9;
            color: #7A5C12;
        }

        .danger-txt {
            color: var(--danger) !important;
        }

        .danger-txt:hover {
            border-color: var(--danger) !important;
        }

        /* ---------- Terminal ---------- */
        .term-modal {
            width: 960px;
        }

        .term-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .term-status {
            font-family: var(--font-mono);
            font-size: 11.5px;
            font-weight: 500;
            color: var(--muted);
            white-space: nowrap;
        }

        .term-status.on {
            color: var(--accent-dark);
        }

        .term-status.off {
            color: var(--danger);
        }

        .term-wrap {
            background: #1C201D;
            padding: 8px;
            height: min(60vh, 520px);
        }

        #term-container {
            height: 100%;
        }

        .term-wrap .xterm {
            height: 100%;
        }

        /* ---------- Responsive ---------- */
        @media (max-width:860px) {
            .sidebar {
                width: 190px;
            }

            .search {
                width: 120px;
            }
        }

        @media (max-width:640px) {
            .body {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                border-right: none;
                border-bottom: 1px solid var(--border);
                max-height: 230px;
            }

            .topbar {
                flex-wrap: wrap;
                row-gap: 8px;
            }

            .breadcrumbs {
                order: 3;
                flex: 1 1 100%;
            }

            .search {
                width: 120px;
            }
        }
    </style>
</head>

<body>
    <div class="app">

        <header class="topbar">
            <div class="brand">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path
                        d="M3 5.5A1.5 1.5 0 0 1 4.5 4h5l2 2h8A1.5 1.5 0 0 1 21 7.5v11A1.5 1.5 0 0 1 19.5 20h-15A1.5 1.5 0 0 1 3 18.5v-13Z" />
                </svg>
                <span>Arquivos</span>
            </div>
            <nav class="breadcrumbs" id="breadcrumbs"></nav>
            <div class="topbar-actions">
                <input type="text" id="filter-input" class="search" placeholder="Filtrar nesta pasta...">
                <button id="btn-pm2" class="icon-btn" title="PM2" aria-label="PM2">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                        stroke-linejoin="round">
                        <rect x="3" y="4" width="18" height="6" rx="1.5" />
                        <rect x="3" y="14" width="18" height="6" rx="1.5" />
                        <path d="M7 7h.01M7 17h.01" />
                    </svg>
                </button>
                <button id="btn-git" class="icon-btn" title="Git" aria-label="Git">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                        stroke-linejoin="round">
                        <circle cx="6" cy="5" r="2" />
                        <circle cx="6" cy="19" r="2" />
                        <circle cx="18" cy="7" r="2" />
                        <path d="M6 7v10M18 9a6 6 0 0 1-6 6H6" />
                    </svg>
                </button>
                <button id="btn-new-folder-toggle" class="icon-btn" title="Nova pasta" aria-label="Nova pasta">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z" />
                        <path d="M12 11v6M9 14h6" />
                    </svg>
                </button>
                <button id="btn-upload-toggle" class="icon-btn" title="Enviar arquivos" aria-label="Enviar arquivos">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M12 16V4M7 9l5-5 5 5" />
                        <path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3" />
                    </svg>
                </button>
                <button id="btn-download-folder" class="icon-btn" title="Baixar pasta (.zip)" aria-label="Baixar pasta">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M12 4v10M7 10l5 5 5-5" />
                        <path d="M4 19h16" />
                    </svg>
                </button>

                <button id="btn-terminal" class="icon-btn" title="Terminal" aria-label="Terminal">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                        stroke-linejoin="round">
                        <rect x="3" y="4" width="18" height="16" rx="2" />
                        <path d="M7 9l3 3-3 3M13 15h4" />
                    </svg>
                </button>
            </div>
        </header>

        <div class="body">
            <aside class="sidebar">
                <section class="side-section">
                    <div class="side-header"><span>Pastas</span></div>
                    <div id="tree" class="tree-scroll">Carregando…</div>
                </section>
            </aside>

            <main class="content" id="content-area">
                <div class="inline-row" id="new-folder-row" hidden>
                    <input type="text" id="new-folder-name" placeholder="Nome da nova pasta">
                    <button class="btn-primary-sm" id="btn-create-folder">Criar</button>
                    <button class="btn-ghost-sm" id="btn-cancel-folder">Cancelar</button>
                </div>

                <input type="file" id="file" multiple hidden>

                <div class="empty-state" id="empty-state" hidden>
                    <p>Esta pasta está vazia.</p>
                    <p class="muted">Arraste arquivos aqui ou use o botão de envio no topo.</p>
                </div>

                <table class="file-table" id="file-table">
                    <thead>
                        <tr>
                            <th></th>
                            <th>Nome</th>
                            <th>Tipo</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="file-list"></tbody>
                </table>

                <div class="drop-overlay" id="drop-overlay">
                    <div>Solte para enviar em</div>
                    <strong id="drop-overlay-path"></strong>
                </div>
            </main>
        </div>

        <footer class="statusbar">
            <span id="status-count">—</span>
            <div class="progress-wrap" id="progress-container" hidden>
                <div class="progress-bar" id="progress-bar"></div>
            </div>
            <span class="status-msg" id="status"></span>
        </footer>
    </div>

    <!-- Modal de edição -->
    <div class="modal-backdrop" id="modal">
        <div class="modal">
            <div class="modal-header" id="modal-title">Editando arquivo</div>
            <textarea id="modal-textarea"></textarea>
            <div class="modal-footer">
                <button class="btn-ghost-sm" onclick="closeModal()">Cancelar</button>
                <button class="btn-primary-sm" onclick="saveFileContent()">Salvar</button>
            </div>
        </div>
    </div>

    <!-- Modal de operações (PM2 / Git) -->
    <div class="modal-backdrop" id="ops-modal">
        <div class="modal ops-modal">
            <div class="modal-header" id="ops-title">Operações</div>
            <div class="ops-body" id="ops-body"></div>
            <div class="modal-footer">
                <button class="btn-ghost-sm" id="ops-close">Fechar</button>
            </div>
        </div>
    </div>

    <div class="modal-backdrop" id="term-modal">
    <div class="modal term-modal">
        <div class="modal-header term-header">
            <span>Terminal</span>
            <span class="term-status" id="term-status">desconectado</span>
        </div>
        <div class="term-wrap">
            <div id="term-container"></div>
        </div>
        <div class="modal-footer">
            <button class="btn-ghost-sm" id="term-reconnect">Reconectar</button>
            <button class="btn-ghost-sm" id="term-close">Fechar</button>
        </div>
    </div>
</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/htmlmixed/htmlmixed.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/clike/clike.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/sql/sql.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/markdown/markdown.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/show-hint.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/javascript-hint.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/html-hint.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/css-hint.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/anyword-hint.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.js"></script>


    <script>
        const dominio = window.location.origin.endsWith("/") ? window.location.origin.slice(0, -1) : window.location.origin;
        const API = dominio + '/admin/filemanager';
        const IMAGE_EXT = ['png', 'jpg', 'jpeg', 'gif', 'webp', 'ico'];
        const ARCHIVE_RE = /\.(zip|tgz|tar|tar\.gz)$/i;

        /* ===================== Estado ===================== */
        let selectedPath = './.';
        let currentEditingPath = '';
        let hideProgressTimeout = null;
        let lastFiles = [];

        const $ = (id) => document.getElementById(id);

        /* ===================== Helpers de rede ===================== */
        async function readResult(res)
        {
            const data = await res.json().catch(() => null);
            return {
                ok: res.ok && !!data && data.ok === true,
                message: (data && data.message) || `Erro ${res.status}`
            };
        }

        async function postJson(url, body = {})
        {
            const res = await fetch(API + url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            return readResult(res);
        }

        async function getJson(url)
        {
            const res = await fetch(API + url);
            if (!res.ok) throw new Error((await readResult(res)).message);
            return res.json();
        }

        function setStatus(msg)
        {
            $('status').textContent = msg;
        }

        /* ===================== Helpers de caminho ===================== */
        const joinPath = (dir, name) => (dir === './.' || dir === '.') ? './' + name : dir + '/' + name;
        const isRoot = (p) => p === './.' || p === '.';

        function cssEscape(str)
        {
            return window.CSS && CSS.escape ? CSS.escape(str) : str.replace(/["\\]/g, '\\$&');
        }

        /* ===================== Editor de código ===================== */
        const codeEditor = CodeMirror.fromTextArea($('modal-textarea'), {
            lineNumbers: true,
            theme: 'dracula',
            mode: 'javascript',
            indentUnit: 4,
            lineWrapping: true,
            extraKeys: {
                'Ctrl-Space': 'autocomplete',
                'Ctrl-S': () => saveFileContent()
            }
        });
        codeEditor.on('inputRead', (cm, change) =>
        {
            if (change.text[0].match(/\w/)) cm.showHint({ completeSingle: false });
        });

        function getEditorMode(filename)
        {
            const ext = filename.split('.').pop().toLowerCase();
            if (['js', 'mjs', 'cjs', 'json', 'xml'].includes(ext)) return 'javascript';
            if (['html', 'htm'].includes(ext)) return 'htmlmixed';
            if (['css', 'scss'].includes(ext)) return 'css';
            if (ext === 'py') return 'python';
            if (ext === 'sql') return 'sql';
            if (ext === 'md') return 'markdown';
            if (['java', 'cpp', 'c', 'cs', 'php'].includes(ext)) return 'clike';
            return 'javascript';
        }

        async function openEditModal(filePath)
        {
            currentEditingPath = filePath;
            try
            {
                const res = await fetch(`${API}/editFile?path=${encodeURIComponent(filePath)}`);
                if (!res.ok) return alert((await readResult(res)).message);
                const content = await res.text();
                $('modal-title').textContent = filePath;
                codeEditor.setOption('mode', getEditorMode(filePath));
                codeEditor.setValue(content);
                $('modal').classList.add('open');
                setTimeout(() => codeEditor.refresh(), 10);
            } catch (err)
            {
                alert('Erro ao abrir o arquivo: ' + err.message);
            }
        }

        function closeModal()
        {
            $('modal').classList.remove('open');
        }

        async function saveFileContent()
        {
            const r = await postJson('/saveFile', { path: currentEditingPath, content: codeEditor.getValue() });
            alert(r.message);
            if (r.ok) closeModal();
        }

        /* ===================== Árvore de pastas ===================== */
        async function loadFolders()
        {
            try
            {
                const dirs = await getJson('/getfolders');
                const tree = $('tree');
                tree.innerHTML = '';
                tree.appendChild(renderTree(buildTree(dirs), '.'));
            } catch (err)
            {
                $('tree').textContent = 'Erro ao carregar pastas: ' + err.message;
            }
        }

        function buildTree(paths)
        {
            const root = {};
            paths.forEach(p =>
            {
                let current = root;
                p.split('/').filter(s => s && s !== '.').forEach(part =>
                {
                    if (!current[part]) current[part] = {};
                    current = current[part];
                });
            });
            return root;
        }

        function renderTree(node, currentPath)
        {
            const ul = document.createElement('ul');
            ul.className = 'tree';

            Object.keys(node).forEach(key =>
            {
                const li = document.createElement('li');
                const fullPath = currentPath === '.' ? './' + key : currentPath + '/' + key;
                const hasChildren = Object.keys(node[key]).length > 0;

                const div = document.createElement('div');
                div.className = 'folder-row';
                div.dataset.path = fullPath;
                if (fullPath === selectedPath) div.classList.add('selected');

                const caret = document.createElement('span');
                caret.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';
                caret.className = 'caret' + (hasChildren ? '' : ' spacer');
                if (hasChildren)
                {
                    caret.onclick = (e) =>
                    {
                        e.stopPropagation();
                        const nested = li.querySelector(':scope > .nested');
                        if (nested)
                        {
                            nested.classList.toggle('active');
                            caret.classList.toggle('open', nested.classList.contains('active'));
                        }
                    };
                }
                div.appendChild(caret);

                const folderIcon = document.createElement('span');
                folderIcon.className = 'folder-icon';
                folderIcon.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 5.5A1.5 1.5 0 0 1 4.5 4h5l2 2h8A1.5 1.5 0 0 1 21 7.5v11A1.5 1.5 0 0 1 19.5 20h-15A1.5 1.5 0 0 1 3 18.5v-13Z"/></svg>';
                div.appendChild(folderIcon);

                const label = document.createElement('span');
                label.className = 'flabel';
                label.textContent = key;
                div.appendChild(label);

                const actionsDiv = document.createElement('div');
                actionsDiv.className = 'file-actions';
                actionsDiv.style.marginLeft = 'auto';
                actionsDiv.appendChild(iconButton('Renomear pasta', 'M20.5 12.6 12 21l-9-9V4h8l9.5 9.5a2 2 0 0 1 0 3.1Z', (e) =>
                {
                    e.stopPropagation();
                    renameItem(currentPath, key, true);
                }));
                actionsDiv.appendChild(iconButton('Excluir pasta', 'M4 7h16|M9 7V4h6v3|M6 7l1 13a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-13', (e) =>
                {
                    e.stopPropagation();
                    deleteFolder(fullPath);
                }, true));
                div.appendChild(actionsDiv);

                div.onclick = () => selectFolder(fullPath);
                li.appendChild(div);

                if (hasChildren)
                {
                    const nestedUl = renderTree(node[key], fullPath);
                    nestedUl.className = 'nested';
                    li.appendChild(nestedUl);
                }
                ul.appendChild(li);
            });
            return ul;
        }

        /* ===================== Navegação / breadcrumbs ===================== */
        function renderBreadcrumbs(path)
        {
            const bar = $('breadcrumbs');
            bar.innerHTML = '';
            const parts = path.split('/').filter(p => p !== '' && p !== '.');
            const crumbs = [{ label: 'Raiz', path: './.' }];
            let acc = '.';
            parts.forEach(p =>
            {
                acc = acc + '/' + p;
                crumbs.push({ label: p, path: acc });
            });

            crumbs.forEach((c, i) =>
            {
                if (i > 0)
                {
                    const sep = document.createElement('span');
                    sep.className = 'sep';
                    sep.textContent = '/';
                    bar.appendChild(sep);
                }
                const btn = document.createElement('button');
                btn.textContent = c.label;
                if (i === crumbs.length - 1) btn.classList.add('current');
                btn.onclick = () => selectFolder(c.path);
                bar.appendChild(btn);
            });
        }

        function selectFolder(fullPath)
        {
            selectedPath = fullPath;
            document.querySelectorAll('.folder-row').forEach(f => f.classList.remove('selected'));
            const node = document.querySelector(`.folder-row[data-path="${cssEscape(fullPath)}"]`);
            if (node) node.classList.add('selected');
            renderBreadcrumbs(fullPath);
            $('new-folder-row').hidden = true;
            $('new-folder-name').value = '';
            $('filter-input').value = '';
            loadFiles(fullPath);
        }

        function refresh()
        {
            return loadFiles(selectedPath);
        }

        /* ===================== Lista de arquivos ===================== */
        async function loadFiles(dir)
        {
            try
            {
                lastFiles = await getJson('/getfiles?path=' + encodeURIComponent(dir));
            } catch (err)
            {
                lastFiles = [];
                setStatus('Erro: ' + err.message);
            }
            renderFileList(lastFiles, dir);
        }

        function makeBadge(text)
        {
            const badge = document.createElement('div');
            badge.className = 'file-badge';
            badge.textContent = text || '—';
            return badge;
        }

        function renderFileList(items, dir)
        {
            const term = $('filter-input').value.trim().toLowerCase();
            const visible = term ? items.filter(f => f.name.toLowerCase().includes(term)) : items;

            const list = $('file-list');
            list.innerHTML = '';
            $('empty-state').hidden = items.length !== 0;
            $('file-table').style.display = visible.length === 0 ? 'none' : 'table';
            $('status-count').textContent = `${items.length} ${items.length === 1 ? 'item' : 'itens'}`;

            visible.forEach(item =>
            {
                const name = item.name;
                const isFolder = item.isDir;
                const filePath = joinPath(dir, name);
                const lower = name.toLowerCase();
                const ext = !isFolder && name.includes('.') ? lower.split('.').pop() : '';
                const isImage = IMAGE_EXT.includes(ext);
                const isArchive = !isFolder && ARCHIVE_RE.test(name);
                const downloadUrl = `${API}/downloadFile?path=${encodeURIComponent(filePath)}`;

                const tr = document.createElement('tr');
                tr.ondblclick = () =>
                {
                    if (isFolder) return selectFolder(filePath);
                    if (isImage) return window.open(downloadUrl, '_blank');
                    openEditModal(filePath);
                };

                // Ícone
                const tdIcon = document.createElement('td');
                tdIcon.className = 'file-icon-col';
                if (isFolder)
                {
                    const badge = document.createElement('div');
                    badge.className = 'file-badge';
                    badge.style.color = 'var(--folder)';
                    badge.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 5.5A1.5 1.5 0 0 1 4.5 4h5l2 2h8A1.5 1.5 0 0 1 21 7.5v11A1.5 1.5 0 0 1 19.5 20h-15A1.5 1.5 0 0 1 3 18.5v-13Z"/></svg>';
                    tdIcon.appendChild(badge);
                } else if (isImage)
                {
                    const img = document.createElement('img');
                    img.className = 'file-thumb';
                    img.loading = 'lazy';
                    img.alt = name;
                    img.src = downloadUrl;
                    img.onerror = () => img.replaceWith(makeBadge(ext));
                    tdIcon.appendChild(img);
                } else
                {
                    tdIcon.appendChild(makeBadge(ext));
                }
                tr.appendChild(tdIcon);

                // Nome
                const tdName = document.createElement('td');
                tdName.className = 'file-name';
                tdName.textContent = name;
                tr.appendChild(tdName);

                // Tipo
                const tdType = document.createElement('td');
                tdType.className = 'file-type';
                tdType.textContent = isFolder ? 'Pasta' : (ext ? '.' + ext : '—');
                tr.appendChild(tdType);

                // Ações
                const tdActions = document.createElement('td');
                const actions = document.createElement('div');
                actions.className = 'file-actions';

                if (!isFolder)
                {
                    if (isImage)
                    {
                        actions.appendChild(iconButton('Visualizar', 'M12 4v12|M7 11l5 5 5-5|M4 20h16', () => window.open(downloadUrl, '_blank')));
                    } else
                    {
                        actions.appendChild(iconButton('Editar', 'M12 20h9|M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z', () => openEditModal(filePath)));
                    }
                    actions.appendChild(iconButton('Baixar', 'M12 4v12|M7 11l5 5 5-5|M4 20h16', () => { window.location.href = downloadUrl; }));
                }

                actions.appendChild(iconButton('Renomear', 'M20.5 12.6 12 21l-9-9V4h8l9.5 9.5a2 2 0 0 1 0 3.1Z', () => renameItem(dir, name, isFolder)));

                if (isArchive)
                {
                    actions.appendChild(iconButton('Descompactar', 'm21 8-9-5-9 5 9 5 9-5Z|M3 8v8l9 5 9-5V8|M12 13v8', () => extractFile(dir, name)));
                }

                actions.appendChild(iconButton('Excluir', 'M4 7h16|M9 7V4h6v3|M6 7l1 13a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-13', () => deleteItem(dir, name, isFolder), true));

                tdActions.appendChild(actions);
                tr.appendChild(tdActions);
                list.appendChild(tr);
            });
        }

        function iconButton(title, pathsPiped, onClick, danger)
        {
            const btn = document.createElement('button');
            btn.className = 'icon-btn' + (danger ? ' danger' : '');
            btn.title = title;
            btn.setAttribute('aria-label', title);
            const d = pathsPiped.split('|').map(p => `<path d="${p}"/>`).join('');
            btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
            btn.onclick = onClick;
            return btn;
        }

        $('filter-input').addEventListener('input', () => renderFileList(lastFiles, selectedPath));

        /* ===================== Ações de arquivo / pasta ===================== */
        async function renameItem(dir, oldName, isFolder)
        {
            const newName = prompt(isFolder ? 'Novo nome para a pasta:' : 'Novo nome:', oldName);
            if (!newName || !newName.trim() || newName.trim() === oldName) return;

            const r = await postJson('/renameFile', { dir, oldName, newName: newName.trim() });
            alert(r.message);
            if (!r.ok) return;

            if (isFolder)
            {
                const oldPath = joinPath(dir, oldName);
                if (selectedPath === oldPath || selectedPath.startsWith(oldPath + '/'))
                {
                    selectedPath = joinPath(dir, newName.trim()) + selectedPath.slice(oldPath.length);
                }
                loadFolders();
            }
            renderBreadcrumbs(selectedPath);
            refresh();
        }

        async function extractFile(dir, fileName)
        {
            if (!confirm(`Deseja descompactar ${fileName}?`)) return;
            const r = await postJson('/extractFile', { dir, fileName });
            alert(r.message);
            if (r.ok) loadFolders();
            refresh();
        }

        async function deleteItem(dir, name, isFolder)
        {
            if (isFolder) return deleteFolder(joinPath(dir, name));
            if (!confirm(`Deseja realmente excluir ${name}?`)) return;
            const r = await postJson('/deleteFile', { dir, fileName: name });
            alert(r.message);
            refresh();
        }

        async function deleteFolder(folderPath)
        {
            if (!confirm(`Deseja realmente excluir a pasta ${folderPath} e todo o seu conteúdo?`)) return;
            const r = await postJson('/deleteFolder', { dir: folderPath });
            alert(r.message);
            if (!r.ok) return;

            if (selectedPath === folderPath || selectedPath.startsWith(folderPath + '/'))
            {
                selectedPath = './.';
            }
            loadFolders();
            selectFolder(selectedPath);
        }

        $('btn-download-folder').onclick = () =>
        {
            window.location.href = `${API}/downloadFolder?path=${encodeURIComponent(selectedPath)}`;
        };

        /* ===================== Nova pasta ===================== */
        $('btn-new-folder-toggle').onclick = () =>
        {
            const row = $('new-folder-row');
            row.hidden = !row.hidden;
            if (!row.hidden) $('new-folder-name').focus();
        };
        $('btn-cancel-folder').onclick = () =>
        {
            $('new-folder-row').hidden = true;
            $('new-folder-name').value = '';
        };
        $('btn-create-folder').onclick = createFolder;
        $('new-folder-name').addEventListener('keydown', (e) => { if (e.key === 'Enter') createFolder(); });

        async function createFolder()
        {
            const name = $('new-folder-name').value.trim();
            if (!name) return alert('Digite o nome da pasta');
            const r = await postJson('/createFolder', { parent: selectedPath, name });
            alert(r.message);
            if (!r.ok) return;
            $('new-folder-name').value = '';
            $('new-folder-row').hidden = true;
            loadFolders();
            refresh();
        }

        /* ===================== Upload ===================== */
        const fileInput = $('file');
        $('btn-upload-toggle').onclick = () => fileInput.click();
        fileInput.onchange = () =>
        {
            if (fileInput.files && fileInput.files.length > 0) uploadFiles(fileInput.files);
        };

        function scheduleHideProgress(ms)
        {
            if (hideProgressTimeout) clearTimeout(hideProgressTimeout);
            hideProgressTimeout = setTimeout(() =>
            {
                $('progress-container').hidden = true;
                $('progress-bar').style.width = '0%';
                $('progress-bar').classList.remove('error');
                hideProgressTimeout = null;
            }, ms);
        }

        function uploadFiles(fileList)
        {
            const fd = new FormData();
            for (let i = 0; i < fileList.length; i++) fd.append('file', fileList[i]);
            fd.append('dest', selectedPath);

            if (hideProgressTimeout) { clearTimeout(hideProgressTimeout); hideProgressTimeout = null; }

            const progressBar = $('progress-bar');
            const uploadBtn = $('btn-upload-toggle');

            progressBar.style.transition = 'none';
            progressBar.classList.remove('error');
            progressBar.style.width = '0%';
            $('progress-container').hidden = false;
            void progressBar.offsetWidth;
            progressBar.style.transition = '';

            setStatus('Enviando arquivos…');
            uploadBtn.disabled = true;

            const xhr = new XMLHttpRequest();
            xhr.open('POST', `${API}/uploadFile`, true);

            xhr.upload.onprogress = (e) =>
            {
                if (e.lengthComputable) progressBar.style.width = Math.round((e.loaded / e.total) * 100) + '%';
            };

            xhr.onload = () =>
            {
                uploadBtn.disabled = false;
                let msg;
                try
                {
                    msg = JSON.parse(xhr.responseText).message;
                } catch
                {
                    msg = xhr.responseText || 'Resposta inválida do servidor.';
                }
                const ok = xhr.status >= 200 && xhr.status < 300;
                setStatus(ok ? msg : `Erro (${xhr.status}): ${msg}`);
                if (!ok) progressBar.classList.add('error');
                refresh();
                fileInput.value = '';
                scheduleHideProgress(2000);
            };

            xhr.onerror = () =>
            {
                uploadBtn.disabled = false;
                setStatus('Erro de rede ao enviar os arquivos.');
                progressBar.classList.add('error');
                scheduleHideProgress(2500);
            };

            xhr.send(fd);
        }

        /* Área de conteúdo aceita arrastar e soltar */
        const contentArea = $('content-area');
        let dragCounter = 0;
        contentArea.addEventListener('dragenter', (e) =>
        {
            e.preventDefault();
            dragCounter++;
            contentArea.classList.add('dragging');
            $('drop-overlay-path').textContent = selectedPath;
        });
        contentArea.addEventListener('dragover', (e) => e.preventDefault());
        contentArea.addEventListener('dragleave', (e) =>
        {
            e.preventDefault();
            dragCounter = Math.max(0, dragCounter - 1);
            if (dragCounter === 0) contentArea.classList.remove('dragging');
        });
        contentArea.addEventListener('drop', (e) =>
        {
            e.preventDefault();
            dragCounter = 0;
            contentArea.classList.remove('dragging');
            if (e.dataTransfer.files && e.dataTransfer.files.length > 0) uploadFiles(e.dataTransfer.files);
        });

        /* ===================== Modal de operações (PM2 / Git) ===================== */
        const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

        function openOps(title, html)
        {
            $('ops-title').textContent = title;
            $('ops-body').innerHTML = html;
            $('ops-body').onclick = null;
            $('ops-modal').classList.add('open');
        }

        function closeOps()
        {
            $('ops-modal').classList.remove('open');
        }

        $('ops-close').onclick = closeOps;
        $('ops-modal').addEventListener('click', (e) => { if (e.target === $('ops-modal')) closeOps(); });
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeOps(); });

        function opsLog(msg)
        {
            const out = $('ops-log');
            if (!out) return;
            const time = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            out.textContent += `\n[${time}] ${msg}`;
            out.scrollTop = out.scrollHeight;
        }

        $('btn-pm2').onclick = openPm2;
        $('btn-git').onclick = openGit;

        /* ---------- PM2 ---------- */
        const PM2_LABEL = { start: 'Iniciar', stop: 'Parar', restart: 'Reiniciar' };

        function openPm2()
        {
            openOps('PM2 — processos', `
                <div class="ops-toolbar">
                    <button class="btn-ghost-sm" id="pm2-refresh">Atualizar</button>
                    <button class="btn-ghost-sm" data-app="all" data-action="restart">Reiniciar todos</button>
                </div>
                <table class="ops-table">
                    <thead><tr><th>App</th><th>Status</th><th>CPU</th><th>Memória</th><th>Restarts</th><th></th></tr></thead>
                    <tbody id="pm2-rows"><tr><td colspan="6">Carregando…</td></tr></tbody>
                </table>
                <pre class="git-output ops-log" id="ops-log">Pronto.</pre>`);

            $('pm2-refresh').onclick = loadPm2;
            $('ops-body').onclick = (e) =>
            {
                const btn = e.target.closest('button[data-action]');
                if (btn) pm2Action(btn.dataset.app, btn.dataset.action);
            };
            loadPm2();
        }

        async function loadPm2()
        {
            const tbody = $('pm2-rows');
            if (!tbody) return;
            try
            {
                const apps = await getJson('/pm2/list');
                if (apps.length === 0)
                {
                    tbody.innerHTML = '<tr><td colspan="6">Nenhum processo encontrado.</td></tr>';
                    return;
                }
                tbody.innerHTML = apps.map(a =>
                {
                    const stCls = ({ online: 'st-online', stopped: 'st-stopped', errored: 'st-error' })[a.status] || 'st-other';
                    const name = esc(a.name);
                    const mainBtn = a.status === 'online'
                        ? `<button class="danger-btn" data-app="${name}" data-action="stop">Parar</button>`
                        : `<button data-app="${name}" data-action="start">Iniciar</button>`;
                    return `<tr>
                        <td>${name}</td>
                        <td><span class="st ${stCls}">${esc(a.status)}</span></td>
                        <td>${a.cpu}%</td>
                        <td>${a.memory} MB</td>
                        <td>${a.restarts}</td>
                        <td><div class="ops-actions">
                            ${mainBtn}
                            <button data-app="${name}" data-action="restart">Reiniciar</button>
                        </div></td>
                    </tr>`;
                }).join('');
            } catch (err)
            {
                opsLog('Erro ao carregar PM2: ' + err.message);
            }
        }

        async function pm2Action(app, action)
        {
            const target = app === 'all' ? 'todos os processos' : app;
            if ((action === 'stop' || app === 'all') && !confirm(`${PM2_LABEL[action]} ${target}?`)) return;

            opsLog(`${PM2_LABEL[action]} ${target}…`);
            try
            {
                const r = await postJson('/pm2/action', { app, action });
                opsLog(r.ok ? r.message : 'Erro: ' + r.message);
                loadPm2();
            } catch (err)
            {
                opsLog('Erro: ' + err.message);
            }
        }

        /* ---------- Git ---------- */
        function openGit()
        {
            openOps('Git — repositório', `
                <div class="ops-toolbar">
                    <button class="btn-ghost-sm" id="git-refresh">Atualizar status</button>
                    <button class="btn-ghost-sm" id="git-pull">Pull (autostash)</button>
                    <button class="btn-ghost-sm danger-txt" id="git-reset">Forçar sincronia com remoto</button>
                </div>
                <pre class="git-output ops-block" id="git-status">Carregando…</pre>

                <div class="ops-section-title">Commit e push</div>
                <div class="field-row">
                    <input type="text" id="git-msg" maxlength="200" placeholder="Mensagem do commit">
                </div>
                <div class="ops-toolbar">
                    <button class="btn-primary-sm" id="git-commit">Commit</button>
                    <button class="btn-ghost-sm" id="git-push">Push</button>
                    <button class="btn-primary-sm" id="git-commit-push">Commit + Push</button>
                </div>

                <div class="ops-section-title">Clonar repositório</div>
                <div class="field-row">
                    <input type="text" id="repo-name" placeholder="usuario/repositorio">
                    <button class="btn-ghost-sm" id="git-clone">Clonar</button>
                </div>

                <pre class="git-output ops-log" id="ops-log">Pronto.</pre>`);

            $('git-refresh').onclick = loadGitStatus;
            $('git-pull').onclick = () => gitPull('autostash');
            $('git-reset').onclick = () =>
            {
                if (confirm('Isso descarta TODAS as alterações locais em arquivos rastreados e alinha com o remoto. Continuar?'))
                {
                    gitPull('reset');
                }
            };
            $('git-commit').onclick = () => gitCommit(false);
            $('git-commit-push').onclick = () => gitCommit(true);
            $('git-push').onclick = () => gitPush();
            $('git-clone').onclick = gitClone;

            loadGitStatus();
        }

        async function loadGitStatus()
        {
            const box = $('git-status');
            if (!box) return;
            try
            {
                const d = await getJson('/git/status');
                box.textContent = `Branch: ${d.branch}\n\n${d.status || 'Árvore de trabalho limpa.'}\n\nÚltimos commits:\n${d.log}`;
            } catch (err)
            {
                box.textContent = 'Erro: ' + err.message;
            }
        }

        async function runGitAction(url, body = {})
        {
            try
            {
                const r = await postJson(url, body);
                opsLog(r.ok ? r.message : 'Erro: ' + r.message);
                loadGitStatus();
                return r.ok;
            } catch (err)
            {
                opsLog('Erro: ' + err.message);
                return false;
            }
        }

        function gitPull(mode)
        {
            opsLog(mode === 'reset' ? 'Sincronizando com o remoto…' : 'Atualizando (pull)…');
            return runGitAction('/git/pull', { mode });
        }

        async function gitCommit(andPush)
        {
            const message = $('git-msg').value.trim();
            if (!message) return alert('Digite a mensagem do commit');

            opsLog('Commitando…');
            const ok = await runGitAction('/git/commit', { message });
            if (!ok) return;
            $('git-msg').value = '';
            if (andPush) await gitPush();
        }

        function gitPush()
        {
            opsLog('Enviando (push)…');
            return runGitAction('/git/push');
        }

        async function gitClone()
        {
            const name = $('repo-name').value.trim();
            if (!name) return alert('Digite o nome do repositório');

            opsLog(`Clonando ${name}…`);
            try
            {
                const r = await postJson('/createRepository', { name });
                opsLog(r.message);
                if (r.ok)
                {
                    $('repo-name').value = '';
                    loadFolders();
                    refresh();
                }
            } catch (err)
            {
                opsLog('Erro ao clonar: ' + err.message);
            }
        }
        /* ===================== Terminal (xterm.js + WebSocket) ===================== */
let termInstance = null;
let termFit = null;
let termWs = null;

function setTermStatus(text, cls) {
    const el = $('term-status');
    el.textContent = text;
    el.className = 'term-status' + (cls ? ' ' + cls : '');
}

function termUrl() {
    const u = new URL(API + '/terminal', location.href);
    u.protocol = u.protocol === 'https:' ? 'wss:' : 'ws:';
    return u.toString();
}

function fitTerminal() {
    if (!termFit || !termInstance) return;
    try { termFit.fit(); } catch { }
}

function sendResize() {
    fitTerminal();
    if (termWs && termWs.readyState === WebSocket.OPEN && termInstance) {
        termWs.send('\x01' + JSON.stringify({ cols: termInstance.cols, rows: termInstance.rows }));
    }
}

function ensureTerminal() {
    if (termInstance) return;
    termInstance = new Terminal({
        cursorBlink: true,
        fontFamily: "'IBM Plex Mono', ui-monospace, monospace",
        fontSize: 13,
        scrollback: 5000,
        theme: { background: '#1C201D', foreground: '#E6E8E4', cursor: '#E6E8E4' }
    });
    termFit = new FitAddon.FitAddon();
    termInstance.loadAddon(termFit);
    termInstance.open($('term-container'));
    termInstance.onData((data) => {
        if (termWs && termWs.readyState === WebSocket.OPEN) termWs.send(data);
    });
    window.addEventListener('resize', () => {
        if ($('term-modal').classList.contains('open')) sendResize();
    });
}

function disconnectTerminal() {
    if (termWs) {
        termWs.onclose = null;
        termWs.onerror = null;
        termWs.onmessage = null;
        termWs.close();
        termWs = null;
    }
}

function connectTerminal() {
    if (!termInstance) return;
    disconnectTerminal();
    termInstance.reset();
    setTermStatus('conectando…');

    const ws = new WebSocket(termUrl());
    termWs = ws;

    ws.onopen = () => {
        setTermStatus('conectado', 'on');
        sendResize();
        termInstance.focus();
    };
    ws.onmessage = (e) => {
        if (typeof e.data === 'string') termInstance.write(e.data);
    };
    ws.onerror = () => setTermStatus('erro', 'off');
    ws.onclose = () => {
        if (termWs === ws) termWs = null;
        setTermStatus('desconectado', 'off');
        termInstance.write('\r\n\x1b[90m[conexão encerrada]\x1b[0m\r\n');
    };
}

function openTerminal() {
    $('term-modal').classList.add('open');
    ensureTerminal();
    requestAnimationFrame(() => {
        fitTerminal();
        connectTerminal();
    });
}

function closeTerminal() {
    disconnectTerminal();
    $('term-modal').classList.remove('open');
    setTermStatus('desconectado', 'off');
}

$('btn-terminal').onclick = openTerminal;
$('term-close').onclick = closeTerminal;
$('term-reconnect').onclick = () => {
    fitTerminal();
    connectTerminal();
};
