<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo - Home</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
        body {
            min-height: 100vh;
            display: flex;
            background: #0f172a;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        .sidebar {
            width: 260px;
            background: #1e293b;
            border-right: 1px solid #334155;
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 1.5rem;
            font-size: 1.1rem;
            font-weight: 700;
            border-bottom: 1px solid #334155;
            color: #f8fafc;
        }

        .sidebar-nav {
            padding: 1.5rem 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .sidebar-nav a {
            color: #94a3b8;
            text-decoration: none;
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            font-size: 0.95rem;
            font-weight: 500;
            transition: all 0.2s;
        }

        .sidebar-nav a:hover, .sidebar-nav a.active {
            background: #334155;
            color: #fff;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .topbar {
            height: 70px;
            background: #1e293b;
            border-bottom: 1px solid #334155;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 2rem;
        }

        .user-info {
            font-size: 0.9rem;
            color: #cbd5e1;
        }

        .btn-logout {
            background: #ef4444;
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 0.375rem;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            text-decoration: none;
        }

        .btn-logout:hover {
            background: #dc2626;
        }

        .content-body {
            padding: 2rem;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        iframe {
            width: 100%;
            height: 100%;
            flex: 1;
            border: none;
            border-radius: 1rem;
            background: #1e293b;
        }

        .welcome-card {
            background: #1e293b;
            padding: 2rem;
            border-radius: 1rem;
            border: 1px solid #334155;
        }

        .welcome-card h2 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }

        .welcome-card p {
            color: #94a3b8;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="sidebar-header">Painel Admin</div>
        <nav class="sidebar-nav">
            
        </nav>
    </aside>

    <div class="main-content">
        <header class="topbar">
            <div class="user-info">Bem-vindo ao sistema</div>
            <a href="/admin/logout" class="btn-logout">Sair</a>
        </header>

        <main class="content-body" id="contentBody">
            <div class="welcome-card">
                <h2>Dashboard Principal</h2>
                <p>Você está autenticado e com a sessão ativa com sucesso!</p>
            </div>
        </main>
    </div>

    <script>
        const pages = {
            'home': { url: '/admin/home', title: 'Home', icon: 'home', description: 'Painel Principal', innerBody: true },
            'assas':{ url: '/admin/assas', title: 'Assas', icon: 'code', description: 'Gerador de Assas', innerBody: false },
            'users':{ url: '/admin/users', title: 'Users', icon: 'users', description: 'Gerenciador de Usuários', innerBody: true },
            'prefab': { url: '/admin/prefab', title: 'Prefab', icon: 'cog', description: 'Gerador de Prefab', innerBody: false },
            'db': { url: '/admin/db', title: 'DB', icon: 'database', description: 'Banco de Dados', innerBody: false },
            'api': { url: '/api', title: 'API', icon: 'code', description: 'Rotas da API', innerBody: false },
            'sprite': { url: '/admin/sprite', title: 'Sprite', icon: 'image', description: 'Gerenciador de Sprites', innerBody: false },
            'folder': { url: '/admin/arquivos', title: 'Folder', icon: 'folder', description: 'Gerenciador de Pastas', innerBody: false },
        };
        
        $(document).ready(() => {
            const $sidebar =$('.sidebar-nav');
            
            for (let key in pages) {
                const page = pages[key];
                const $a =$('<a></a>')
                    .attr('href', '#')
                    .text(page.title)
                    .on('click', (e) => {
                        e.preventDefault();
                        if (page.innerBody) {
                            loadContent(page.url, $a);
                        } else {
                            window.open(page.url, '_blank');
                        }
                    });
                
                $sidebar.append($a);
            }
        });
        
        function loadContent(url, $element) {
            $('.sidebar-nav a').removeClass('active');$element.addClass('active');

            const container = document.getElementById('contentBody');

            if (url === '/admin/db') {
                container.innerHTML = `<iframe src="${url}"></iframe>`;
            } else {
                $.get(url)
                    .done(html => {
                        container.innerHTML = html;
                    })
                    .fail(() => {
                        container.innerHTML = '<div class="welcome-card"><h2>Erro</h2><p>Não foi possível carregar o conteúdo.</p></div>';
                    });
            }
        }
    </script>
</body>
</html>
