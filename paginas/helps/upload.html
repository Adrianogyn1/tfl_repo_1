<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gerenciador de Arquivos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/show-hint.min.css">
<style>
  :root{
    --bg-app:#F3F4F1;
    --bg-panel:#FFFFFF;
    --bg-sidebar:#EBECE7;
    --bg-sidebar-hover:#DEE0DA;
    --border:#DCDDD6;
    --ink:#1C201D;
    --muted:#6D746D;
    --accent:#2B6F62;
    --accent-dark:#215A50;
    --accent-soft:#DCEAE6;
    --danger:#B23B2E;
    --danger-soft:#F5E2DF;
    --folder:#C99A4B;
    --font-sans:'IBM Plex Sans', system-ui, sans-serif;
    --font-mono:'IBM Plex Mono', ui-monospace, 'SF Mono', monospace;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{font-family:var(--font-sans);color:var(--ink);background:var(--bg-app);}
  button,input{font-family:inherit;color:inherit;}
  button{cursor:pointer;}
  svg{display:block;}

  .app{display:flex;flex-direction:column;height:100vh;}

  /* ---------- Topbar ---------- */
  .topbar{
    display:flex;align-items:center;gap:16px;
    padding:10px 18px;background:var(--bg-panel);
    border-bottom:1px solid var(--border);flex-shrink:0;
  }
  .brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14.5px;flex-shrink:0;}
  .brand svg{width:18px;height:18px;color:var(--accent);}
  .breadcrumbs{
    flex:1;display:flex;align-items:center;gap:2px;
    font-family:var(--font-mono);font-size:13px;color:var(--muted);
    overflow-x:auto;white-space:nowrap;min-width:0;
  }
  .breadcrumbs::-webkit-scrollbar{height:0;}
  .breadcrumbs button{background:none;border:none;color:var(--muted);padding:4px 6px;border-radius:5px;font-family:inherit;font-size:inherit;}
  .breadcrumbs button:hover{background:var(--accent-soft);color:var(--accent);}
  .breadcrumbs button.current{color:var(--ink);font-weight:600;}
  .breadcrumbs .sep{color:var(--border);padding:0 1px;}

  .topbar-actions{display:flex;align-items:center;gap:6px;flex-shrink:0;}
  .search{
    font-size:13px;padding:7px 10px;border:1px solid var(--border);
    border-radius:6px;background:var(--bg-app);width:170px;
  }
  .search:focus-visible{outline:2px solid var(--accent-soft);outline-offset:1px;border-color:var(--accent);}

  .icon-btn{
    display:inline-flex;align-items:center;justify-content:center;
    width:32px;height:32px;border-radius:6px;border:1px solid transparent;
    background:none;color:var(--muted);
  }
  .icon-btn:hover{background:var(--accent-soft);color:var(--accent-dark);}
  .icon-btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px;}
  .icon-btn svg{width:16.5px;height:16.5px;}
  .icon-btn.danger:hover{background:var(--danger-soft);color:var(--danger);}

  /* ---------- Body layout ---------- */
  .body{flex:1;display:flex;min-height:0;}

  .sidebar{
    width:250px;flex-shrink:0;background:var(--bg-sidebar);
    border-right:1px solid var(--border);
    display:flex;flex-direction:column;overflow-y:auto;
  }
  .side-section{border-bottom:1px solid var(--border);}
  .side-section:last-child{border-bottom:none;}
  .side-header{
    display:flex;align-items:center;gap:6px;width:100%;
    padding:11px 14px;font-size:12px;font-weight:600;
    color:var(--muted);background:none;border:none;text-align:left;
  }
  .side-header.toggle{cursor:pointer;}
  .side-header.toggle:hover{color:var(--ink);}
  .side-header .chev{width:11px;height:11px;transition:transform .15s ease;flex-shrink:0;}
  .side-header.open .chev{transform:rotate(90deg);}

  .tree-scroll{padding:0 8px 12px;font-size:13.5px;max-height:340px;overflow-y:auto;}
  ul.tree,ul.tree ul{list-style:none;margin:0;padding-left:14px;}
  ul.tree{padding-left:0;}
  .folder-row{
    display:flex;align-items:center;gap:5px;padding:5px 7px;
    border-radius:6px;color:var(--ink);min-width:0;
  }
  .folder-row:hover{background:var(--bg-sidebar-hover);}
  .folder-row.selected{background:var(--accent);color:#fff;}
  .folder-row .caret{width:10px;height:10px;flex-shrink:0;color:var(--muted);transition:transform .15s ease;}
  .folder-row .caret.spacer{visibility:hidden;}
  .folder-row .caret.open{transform:rotate(90deg);}
  .folder-row.selected .caret{color:#fff;}
  .folder-row .folder-icon{width:14px;height:14px;flex-shrink:0;color:var(--folder);}
  .folder-row.selected .folder-icon{color:#fff;}
  .folder-row .flabel{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .nested{display:none;}
  .nested.active{display:block;}

  .side-content{padding:10px 14px 14px;display:flex;flex-direction:column;gap:8px;}
  .btn-line{
    font-size:13px;padding:7px 10px;border-radius:6px;border:1px solid var(--border);
    background:var(--bg-panel);text-align:left;display:flex;align-items:center;gap:7px;
  }
  .btn-line:hover{border-color:var(--accent);color:var(--accent-dark);}
  .btn-line svg{width:14px;height:14px;flex-shrink:0;}
  .field-row{display:flex;gap:6px;}
  .field-row input{
    flex:1;min-width:0;font-family:var(--font-mono);font-size:12.5px;
    padding:6px 8px;border:1px solid var(--border);border-radius:6px;background:var(--bg-panel);
  }
  .git-output{
    margin:0;font-family:var(--font-mono);font-size:11.5px;line-height:1.6;
    color:var(--muted);background:var(--bg-panel);border:1px solid var(--border);
    border-radius:6px;padding:8px;max-height:120px;overflow-y:auto;white-space:pre-wrap;word-break:break-word;
  }

  /* ---------- Content ---------- */
  .content{flex:1;position:relative;overflow-y:auto;padding:18px 22px 8px;}
  .inline-row{display:flex;gap:8px;align-items:center;margin-bottom:16px;}
  .inline-row input{
    font-family:var(--font-mono);font-size:13px;padding:7px 10px;
    border:1px solid var(--border);border-radius:6px;flex:0 0 240px;background:var(--bg-panel);
  }
  .btn-primary-sm{font-size:13px;font-weight:600;padding:7px 14px;border-radius:6px;border:none;background:var(--accent);color:#fff;}
  .btn-primary-sm:hover{background:var(--accent-dark);}
  .btn-ghost-sm{font-size:13px;padding:7px 12px;border-radius:6px;border:1px solid var(--border);background:none;color:var(--muted);}
  .btn-ghost-sm:hover{color:var(--ink);border-color:var(--ink);}

  .empty-state{padding:70px 0;text-align:center;color:var(--muted);}
  .empty-state p{margin:0 0 4px;font-size:14px;}
  .empty-state .muted{font-size:12.5px;}

  .file-table{width:100%;border-collapse:collapse;font-size:13.5px;}
  .file-table thead th{
    text-align:left;font-weight:600;color:var(--muted);font-size:11.5px;
    padding:6px 10px;border-bottom:1px solid var(--border);
  }
  .file-table tbody tr{border-bottom:1px solid var(--border);}
  .file-table tbody tr:hover{background:var(--bg-panel);}
  .file-table td{padding:7px 10px;vertical-align:middle;}
  .file-icon-col{width:38px;}
  .file-thumb{width:26px;height:26px;object-fit:cover;border-radius:4px;border:1px solid var(--border);}
  .file-badge{
    width:26px;height:26px;border-radius:4px;background:var(--bg-sidebar);
    border:1px solid var(--border);display:flex;align-items:center;justify-content:center;
    font-size:8.5px;font-weight:700;color:var(--muted);font-family:var(--font-mono);text-transform:uppercase;
  }
  .file-name{font-family:var(--font-mono);font-size:13px;color:var(--ink);}
  .file-type{color:var(--muted);font-size:11.5px;font-family:var(--font-mono);}
  .file-actions{display:flex;gap:1px;justify-content:flex-end;}

  .drop-overlay{
    position:absolute;inset:10px;background:rgba(43,111,98,.06);
    border:2px dashed var(--accent);border-radius:8px;
    display:none;align-items:center;justify-content:center;flex-direction:column;gap:4px;
    font-size:14.5px;font-weight:600;color:var(--accent-dark);pointer-events:none;text-align:center;
  }
  .content.dragging .drop-overlay{display:flex;}
  .drop-overlay strong{font-family:var(--font-mono);font-weight:600;}

  /* ---------- Status bar ---------- */
  .statusbar{
    display:flex;align-items:center;gap:14px;padding:8px 18px;
    border-top:1px solid var(--border);background:var(--bg-panel);
    font-size:12.5px;color:var(--muted);flex-shrink:0;
  }
  .progress-wrap{width:150px;height:6px;border-radius:3px;background:var(--border);overflow:hidden;flex-shrink:0;}
  .progress-bar{height:100%;width:0%;background:var(--accent);transition:width .2s ease;}
  .progress-bar.error{background:var(--danger);}
  .status-msg{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  /* ---------- Modal ---------- */
  .modal-backdrop{position:fixed;inset:0;background:rgba(20,22,20,.5);display:none;align-items:center;justify-content:center;z-index:50;padding:24px;}
  .modal-backdrop.open{display:flex;}
  .modal{background:var(--bg-panel);border-radius:8px;width:880px;max-width:100%;box-shadow:0 24px 60px rgba(0,0,0,.28);display:flex;flex-direction:column;overflow:hidden;}
  .modal-header{padding:14px 18px;border-bottom:1px solid var(--border);font-family:var(--font-mono);font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .modal-footer{padding:12px 18px;display:flex;justify-content:flex-end;gap:8px;border-top:1px solid var(--border);}
  .CodeMirror{height:min(60vh,460px);font-size:13.5px;font-family:var(--font-mono);}

  /* ---------- Responsive ---------- */
  @media (max-width:860px){
    .sidebar{width:190px;}
    .search{width:120px;}
  }
  @media (max-width:640px){
    .body{flex-direction:column;}
    .sidebar{width:100%;border-right:none;border-bottom:1px solid var(--border);max-height:230px;}
    .topbar{flex-wrap:wrap;row-gap:8px;}
    .breadcrumbs{order:3;flex:1 1 100%;}
    .search{width:120px;}
  }
</style>
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 5.5A1.5 1.5 0 0 1 4.5 4h5l2 2h8A1.5 1.5 0 0 1 21 7.5v11A1.5 1.5 0 0 1 19.5 20h-15A1.5 1.5 0 0 1 3 18.5v-13Z"/></svg>
      <span>Arquivos</span>
    </div>
    <nav class="breadcrumbs" id="breadcrumbs"></nav>
    <div class="topbar-actions">
      <input type="text" id="filter-input" class="search" placeholder="Filtrar nesta pasta...">
      <button id="btn-new-folder-toggle" class="icon-btn" title="Nova pasta" aria-label="Nova pasta">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"/><path d="M12 11v6M9 14h6"/></svg>
      </button>
      <button id="btn-upload-toggle" class="icon-btn" title="Enviar arquivos" aria-label="Enviar arquivos">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>
      </button>
      <button id="btn-download-folder" class="icon-btn" title="Baixar pasta (.zip)" aria-label="Baixar pasta">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v10M7 10l5 5 5-5"/><path d="M4 19h16"/></svg>
      </button>
    </div>
  </header>

  <div class="body">
    <aside class="sidebar">
      <section class="side-section">
        <div class="side-header"><span>Pastas</span></div>
        <div id="tree" class="tree-scroll">Carregando…</div>
      </section>

      <section class="side-section">
        <button class="side-header toggle" id="git-toggle">
          <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
          <span>Git</span>
        </button>
        <div class="side-content" id="git-content" hidden>
          <button class="btn-line" id="btn-git-pull">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>
            Atualizar projeto (pull)
          </button>
          <div class="field-row">
            <input type="text" id="repo-name" placeholder="usuario/repositorio">
            <button class="icon-btn" id="btn-git-clone" title="Clonar repositório" aria-label="Clonar repositório">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="4.5" r="2"/><circle cx="6" cy="19.5" r="2"/><circle cx="18" cy="8.5" r="2"/><path d="M6 6.5v11M6 13a7.5 7.5 0 0 0 7.5-7.5"/></svg>
            </button>
          </div>
          <pre class="git-output" id="git-output">Aguardando ações…</pre>
        </div>
      </section>
    </aside>

    <main class="content" id="content">
      <div class="inline-row" id="new-folder-row" hidden>
        <input type="text" id="new-folder-name" placeholder="Nome da nova pasta">
        <button class="btn-primary-sm" id="btn-create-folder">Criar</button>
        <button class="btn-ghost-sm" id="btn-cancel-folder">Cancelar</button>
      </div>

      <input type="file" id="file" multiple hidden>

      <div class="empty-state" id="empty-state" hidden>
        <p>Esta pasta está vazia.</p>
        <p class="muted">Arraste arquivos aqui ou use o botão de envio no topo.</p>
      </div>

      <table class="file-table" id="file-table">
        <thead>
          <tr><th></th><th>Nome</th><th>Tipo</th><th></th></tr>
        </thead>
        <tbody id="file-list"></tbody>
      </table>

      <div class="drop-overlay" id="drop-overlay">
        <div>Solte para enviar em</div>
        <strong id="drop-overlay-path"></strong>
      </div>
    </main>
  </div>

  <footer class="statusbar">
    <span id="status-count">—</span>
    <div class="progress-wrap" id="progress-container" hidden>
      <div class="progress-bar" id="progress-bar"></div>
    </div>
    <span class="status-msg" id="status"></span>
  </footer>
</div>

<!-- Modal de edição -->
<div class="modal-backdrop" id="modal">
  <div class="modal">
    <div class="modal-header" id="modal-title">Editando arquivo</div>
    <textarea id="modal-textarea"></textarea>
    <div class="modal-footer">
      <button class="btn-ghost-sm" onclick="closeModal()">Cancelar</button>
      <button class="btn-primary-sm" onclick="saveFileContent()">Salvar</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/htmlmixed/htmlmixed.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/clike/clike.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/sql/sql.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/markdown/markdown.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/show-hint.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/javascript-hint.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/html-hint.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/css-hint.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/anyword-hint.min.js"></script>

<script>
/* ===================== Estado ===================== */
let selectedPath = './.';
let currentEditingPath = '';
let hideProgressTimeout = null;
let lastFiles = [];

const $ = (id) => document.getElementById(id);

/* ===================== Editor de código ===================== */
let codeEditor = CodeMirror.fromTextArea($('modal-textarea'), {
  lineNumbers: true,
  theme: 'dracula',
  mode: 'javascript',
  indentUnit: 4,
  lineWrapping: true,
  extraKeys: { "Ctrl-Space": "autocomplete" }
});
codeEditor.on("inputRead", function (cm, change) {
  if (change.text[0].match(/\w/)) cm.showHint({ completeSingle: false });
});

function getEditorMode(filename) {
  let ext = filename.split('.').pop().toLowerCase();
  if (['js', 'mjs', 'cjs'].includes(ext)) return 'javascript';
  if (['html', 'htm'].includes(ext)) return 'htmlmixed';
  if (['css', 'scss'].includes(ext)) return 'css';
  if (['json', 'xml'].includes(ext)) return 'javascript';
  if (['py'].includes(ext)) return 'python';
  if (['sql'].includes(ext)) return 'sql';
  if (['md'].includes(ext)) return 'markdown';
  if (['java', 'cpp', 'c', 'cs', 'php'].includes(ext)) return 'clike';
  return 'javascript';
}

async function openEditModal(filePath) {
  currentEditingPath = filePath;
  let res = await fetch(`/helps/editFile?path=${encodeURIComponent(filePath)}`);
  if (!res.ok) { alert('Erro ao abrir o arquivo'); return; }
  let content = await res.text();
  $('modal-title').textContent = filePath;
  codeEditor.setOption('mode', getEditorMode(filePath));
  codeEditor.setValue(content);
  $('modal').classList.add('open');
  setTimeout(() => codeEditor.refresh(), 10);
}
function closeModal() { $('modal').classList.remove('open'); }

async function saveFileContent() {
  let content = codeEditor.getValue();
  let res = await fetch('/helps/saveFile', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ path: currentEditingPath, content })
  });
  let msg = await res.text();
  alert(msg);
  if (res.ok) closeModal();
}

/* ===================== Árvore de pastas ===================== */
async function loadFolders() {
  let res = await fetch('/helps/getfolders');
  let dirs = await res.json();
  let root = buildTree(dirs);
  let treeContainer = $('tree');
  treeContainer.innerHTML = '';
  treeContainer.appendChild(renderTree(root, '.'));
}

function buildTree(paths) {
  let root = {};
  paths.forEach(p => {
    let parts = p.split('/').filter(Boolean);
    let current = root;
    parts.forEach(part => {
      if (!current[part]) current[part] = {};
      current = current[part];
    });
  });
  return root;
}

function renderTree(node, currentPath) {
  let ul = document.createElement('ul');
  ul.className = 'tree active';

  for (let key in node) {
    let li = document.createElement('li');
    let fullPath = currentPath === '.' ? './' + key : currentPath + '/' + key;
    let hasChildren = Object.keys(node[key]).length > 0;

    let div = document.createElement('div');
    div.className = 'folder-row';
    div.dataset.path = fullPath;
    if (fullPath === selectedPath) div.classList.add('selected');

    let caret = document.createElement('span');
    caret.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';
    caret.className = 'caret' + (hasChildren ? '' : ' spacer');
    if (hasChildren) {
      caret.onclick = (e) => {
        e.stopPropagation();
        let nested = li.querySelector(':scope > .nested');
        if (nested) {
          nested.classList.toggle('active');
          caret.classList.toggle('open', nested.classList.contains('active'));
        }
      };
    }
    div.appendChild(caret);

    let folderIcon = document.createElement('span');
    folderIcon.className = 'folder-icon';
    folderIcon.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 5.5A1.5 1.5 0 0 1 4.5 4h5l2 2h8A1.5 1.5 0 0 1 21 7.5v11A1.5 1.5 0 0 1 19.5 20h-15A1.5 1.5 0 0 1 3 18.5v-13Z"/></svg>';
    div.appendChild(folderIcon);

    let label = document.createElement('span');
    label.className = 'flabel';
    label.textContent = key;
    div.appendChild(label);

    div.onclick = () => selectFolder(fullPath);
    li.appendChild(div);

    if (hasChildren) {
      let nestedUl = renderTree(node[key], fullPath);
      nestedUl.classList.remove('active');
      nestedUl.classList.add('nested');
      li.appendChild(nestedUl);
    }
    ul.appendChild(li);
  }
  return ul;
}

/* ===================== Navegação / breadcrumbs ===================== */
function renderBreadcrumbs(path) {
  let bar = $('breadcrumbs');
  bar.innerHTML = '';
  let parts = path.split('/').filter(p => p !== '' && p !== '.');
  let crumbs = [{ label: 'Raiz', path: './.' }];
  let acc = '.';
  parts.forEach(p => { acc = acc + '/' + p; crumbs.push({ label: p, path: acc }); });

  crumbs.forEach((c, i) => {
    if (i > 0) {
      let sep = document.createElement('span');
      sep.className = 'sep';
      sep.textContent = '/';
      bar.appendChild(sep);
    }
    let btn = document.createElement('button');
    btn.textContent = c.label;
    if (i === crumbs.length - 1) btn.classList.add('current');
    btn.onclick = () => selectFolder(c.path);
    bar.appendChild(btn);
  });
}

function selectFolder(fullPath) {
  selectedPath = fullPath;
  document.querySelectorAll('.folder-row').forEach(f => f.classList.remove('selected'));
  let node = document.querySelector(`.folder-row[data-path="${cssEscape(fullPath)}"]`);
  if (node) node.classList.add('selected');
  renderBreadcrumbs(fullPath);
  $('new-folder-row').hidden = true;
  $('new-folder-name').value = '';
  $('filter-input').value = '';
  loadFiles(fullPath);
}

function cssEscape(str) {
  return window.CSS && CSS.escape ? CSS.escape(str) : str.replace(/["\\]/g, '\\$&');
}

/* ===================== Lista de arquivos ===================== */
async function loadFiles(path) {
  let res = await fetch('/helps/getfiles?path=' + encodeURIComponent(path));
  lastFiles = await res.json();
  renderFileList(lastFiles, path);
}

function renderFileList(files, path) {
  let filterTerm = $('filter-input').value.trim().toLowerCase();
  let visible = filterTerm ? files.filter(f => f.toLowerCase().includes(filterTerm)) : files;

  let list = $('file-list');
  list.innerHTML = '';
  $('empty-state').hidden = visible.length !== 0;
  $('file-table').style.display = visible.length === 0 ? 'none' : 'table';
  $('status-count').textContent = `${files.length} ${files.length === 1 ? 'item' : 'itens'}`;

  visible.forEach(f => {
    let filePath = path + '/' + f;
    let ext = f.includes('.') ? f.split('.').pop().toLowerCase() : '';

    let tr = document.createElement('tr');

    let tdIcon = document.createElement('td');
    tdIcon.className = 'file-icon-col';
    if (['png', 'jpg', 'jpeg', 'gif', 'webp', 'ico'].includes(ext)) {
      let img = document.createElement('img');
      img.className = 'file-thumb';
      img.src = `/helps/downloadFile?path=${encodeURIComponent(filePath)}`;
      tdIcon.appendChild(img);
    } else {
      let badge = document.createElement('div');
      badge.className = 'file-badge';
      badge.textContent = ext || '—';
      tdIcon.appendChild(badge);
    }
    tr.appendChild(tdIcon);

    let tdName = document.createElement('td');
    tdName.className = 'file-name';
    tdName.textContent = f;
    tr.appendChild(tdName);

    let tdType = document.createElement('td');
    tdType.className = 'file-type';
    tdType.textContent = ext ? '.' + ext : '—';
    tr.appendChild(tdType);

    let tdActions = document.createElement('td');
    let actions = document.createElement('div');
    actions.className = 'file-actions';

    actions.appendChild(iconButton('Editar', 'M12 20h9|M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z', () => openEditModal(filePath)));
    actions.appendChild(iconButton('Baixar', 'M12 4v12|M7 11l5 5 5-5|M4 20h16', () => window.location.href = `/helps/downloadFile?path=${encodeURIComponent(filePath)}`));
    actions.appendChild(iconButton('Renomear', 'M20.5 12.6 12 21l-9-9V4h8l9.5 9.5a2 2 0 0 1 0 3.1Z', () => renameFile(path, f)));
    if (f.endsWith('.tar.gz') || f.endsWith('.zip')) {
      actions.appendChild(iconButton('Descompactar', 'm21 8-9-5-9 5 9 5 9-5Z|M3 8v8l9 5 9-5V8|M12 13v8', () => extractFile(path, f)));
    }
    actions.appendChild(iconButton('Excluir', 'M4 7h16|M9 7V4h6v3|M6 7l1 13a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-13', () => deleteFile(path, f), true));

    tdActions.appendChild(actions);
    tr.appendChild(tdActions);

    list.appendChild(tr);
  });
}

function iconButton(title, pathsPiped, onClick, danger) {
  let btn = document.createElement('button');
  btn.className = 'icon-btn' + (danger ? ' danger' : '');
  btn.title = title;
  btn.setAttribute('aria-label', title);
  let d = pathsPiped.split('|').map(d => `<path d="${d}"/>`).join('');
  btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
  btn.onclick = onClick;
  return btn;
}

$('filter-input').addEventListener('input', () => renderFileList(lastFiles, selectedPath));

/* ===================== Ações de arquivo ===================== */
async function renameFile(dir, oldName) {
  let newName = prompt('Novo nome:', oldName);
  if (!newName || !newName.trim() || newName === oldName) return;
  let res = await fetch('/helps/renameFile', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ dir, oldName, newName })
  });
  let msg = await res.text();
  alert(msg);
  loadFiles(dir);
}

async function extractFile(dir, fileName) {
  if (!confirm(`Deseja descompactar ${fileName}?`)) return;
  let res = await fetch('/helps/extractFile', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ dir, fileName })
  });
  let msg = await res.text();
  alert(msg);
  loadFiles(dir);
}

async function deleteFile(dir, fileName) {
  if (!confirm(`Deseja realmente excluir ${fileName}?`)) return;
  let res = await fetch('/helps/deleteFile', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ dir, fileName })
  });
  let msg = await res.text();
  alert(msg);
  loadFiles(dir);
}

function downloadFolder() {
  window.location.href = `/helps/downloadFolder?path=${encodeURIComponent(selectedPath)}`;
}
$('btn-download-folder').onclick = downloadFolder;

/* ===================== Nova pasta ===================== */
$('btn-new-folder-toggle').onclick = () => {
  let row = $('new-folder-row');
  row.hidden = !row.hidden;
  if (!row.hidden) $('new-folder-name').focus();
};
$('btn-cancel-folder').onclick = () => {
  $('new-folder-row').hidden = true;
  $('new-folder-name').value = '';
};
$('btn-create-folder').onclick = createFolder;
$('new-folder-name').addEventListener('keydown', (e) => { if (e.key === 'Enter') createFolder(); });

async function createFolder() {
  let folderName = $('new-folder-name').value.trim();
  if (!folderName) return alert('Digite o nome da pasta');
  let res = await fetch('/helps/createFolder', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ parent: selectedPath, name: folderName })
  });
  let msg = await res.text();
  alert(msg);
  $('new-folder-name').value = '';
  $('new-folder-row').hidden = true;
  loadFolders();
}

/* ===================== Upload (com barra de progresso corrigida) ===================== */
let fileInput = $('file');
$('btn-upload-toggle').onclick = () => fileInput.click();
fileInput.onchange = () => {
  if (fileInput.files && fileInput.files.length > 0) uploadFiles(fileInput.files);
};

function uploadFiles(fileList) {
  let fd = new FormData();
  for (let i = 0; i < fileList.length; i++) fd.append('file', fileList[i]);
  fd.append('dest', selectedPath);

  if (hideProgressTimeout) { clearTimeout(hideProgressTimeout); hideProgressTimeout = null; }

  let progressContainer = $('progress-container');
  let progressBar = $('progress-bar');
  let uploadBtn = $('btn-upload-toggle');
  let statusEl = $('status');

  progressBar.style.transition = 'none';
  progressBar.classList.remove('error');
  progressBar.style.width = '0%';
  progressContainer.hidden = false;
  void progressBar.offsetWidth;
  progressBar.style.transition = '';

  statusEl.textContent = 'Enviando arquivos…';
  uploadBtn.disabled = true;

  let xhr = new XMLHttpRequest();
  xhr.open('POST', '/helps/uploadFile', true);

  xhr.upload.onprogress = (e) => {
    if (e.lengthComputable) {
      let percent = Math.round((e.loaded / e.total) * 100);
      progressBar.style.width = percent + '%';
    }
  };
  xhr.upload.onloadend = () => { progressBar.style.width = '100%'; };

  xhr.onload = () => {
    uploadBtn.disabled = false;
    let ok = xhr.status >= 200 && xhr.status < 300;
    statusEl.textContent = ok ? xhr.responseText : `Erro (${xhr.status}): ${xhr.responseText}`;
    if (!ok) progressBar.classList.add('error');

    loadFiles(selectedPath);
    fileInput.value = '';

    hideProgressTimeout = setTimeout(() => {
      progressContainer.hidden = true;
      progressBar.style.width = '0%';
      progressBar.classList.remove('error');
      hideProgressTimeout = null;
    }, 2000);
  };

  xhr.onerror = () => {
    uploadBtn.disabled = false;
    statusEl.textContent = 'Erro de rede ao enviar os arquivos.';
    progressBar.classList.add('error');
    hideProgressTimeout = setTimeout(() => {
      progressContainer.hidden = true;
      progressBar.style.width = '0%';
      progressBar.classList.remove('error');
      hideProgressTimeout = null;
    }, 2500);
  };

  xhr.send(fd);
}

/* Área inteira de conteúdo aceita arrastar-e-soltar */
let content = $('content');
let dragCounter = 0;
content.addEventListener('dragenter', (e) => {
  e.preventDefault();
  dragCounter++;
  content.classList.add('dragging');
  $('drop-overlay-path').textContent = selectedPath;
});
content.addEventListener('dragover', (e) => e.preventDefault());
content.addEventListener('dragleave', (e) => {
  e.preventDefault();
  dragCounter = Math.max(0, dragCounter - 1);
  if (dragCounter === 0) content.classList.remove('dragging');
});
content.addEventListener('drop', (e) => {
  e.preventDefault();
  dragCounter = 0;
  content.classList.remove('dragging');
  if (e.dataTransfer.files && e.dataTransfer.files.length > 0) uploadFiles(e.dataTransfer.files);
});

/* ===================== Git ===================== */
$('git-toggle').onclick = () => {
  let gitContent = $('git-content');
  gitContent.hidden = !gitContent.hidden;
  $('git-toggle').classList.toggle('open', !gitContent.hidden);
};

function logGit(msg) {
  let out = $('git-output');
  let time = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  out.textContent += `\n[${time}] ${msg}`;
  out.scrollTop = out.scrollHeight;
}

$('btn-git-pull').onclick = async () => {
  logGit('Atualizando projeto…');
  try {
    let res = await fetch('/helps/updateGit', { method: 'POST' });
    logGit(await res.text());
  } catch (err) {
    logGit('Erro ao atualizar: ' + err.message);
  }
};

$('btn-git-clone').onclick = async () => {
  let name = $('repo-name').value.trim();
  if (!name) return alert('Digite o nome do repositório');
  logGit(`Clonando ${name}…`);
  try {
    let res = await fetch('/helps/createRepository', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name })
    });
    logGit(await res.text());
    $.post('/helps/refresh');
    
  } catch (err) {
    logGit('Erro ao clonar: ' + err.message);
  }
};


/* ===================== Inicialização ===================== */
renderBreadcrumbs(selectedPath);
loadFiles(selectedPath);
loadFolders();
</script>
