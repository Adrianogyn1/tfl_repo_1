<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Feed & Profiles</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body class="bg-[#18191a] text-[#e4e6eb] font-sans antialiased min-h-screen">

<div class="max-w-2xl mx-auto p-4 flex flex-col gap-5 pb-24">
    
    <!-- Header / Identidade -->
    <div class="bg-[#242526] rounded-xl p-4 shadow-md border border-[#3a3b3c]">
        <div class="flex items-center justify-between border-b border-[#3a3b3c] pb-3 mb-3">
            <h1 class="text-xl font-bold text-white tracking-wide cursor-pointer" id="brandLogo">
                <i class="fa-solid fa-circle-nodes text-[#00adb5] mr-2"></i>Rede Social
            </h1>
            <div class="flex items-center gap-2">
                <button onclick="openModal()" class="bg-blue-600 text-white text-xs px-3 py-1.5 rounded-lg shadow hover:bg-blue-700 transition-colors">
                    Abrir Usuários
                </button>
                <button id="btnOpenSettings" class="text-gray-400 hover:text-white p-2 rounded-lg transition-colors" title="Configurações de Endpoints">
                    <i class="fa-solid fa-gear text-lg"></i>
                </button>
                <span class="text-xs bg-[#00adb5] text-white px-2.5 py-1 rounded-full font-semibold">API Conectada</span>
            </div>
        </div>
        <div class="flex flex-col gap-3">
            <div class="flex gap-2">
                <input type="text" id="authLogin" placeholder="Usuário" class="w-1/2 p-2 rounded-lg bg-[#3a3b3c] border border-transparent text-sm text-white placeholder-gray-400 focus:outline-none focus:border-[#00adb5]">
                <input type="password" id="authPass" placeholder="Senha" class="w-1/2 p-2 rounded-lg bg-[#3a3b3c] border border-transparent text-sm text-white placeholder-gray-400 focus:outline-none focus:border-[#00adb5]">
            </div>
            <div class="flex gap-2">
                <button id="btnSignIn" class="flex-1 py-2 rounded-lg bg-[#2d88ff] hover:bg-[#1a73e8] text-white font-bold text-sm transition-colors"><i class="fa-solid fa-right-to-bracket mr-1"></i> Entrar</button>
                <button id="btnSignUp" class="flex-1 py-2 rounded-lg bg-[#3a3b3c] hover:bg-[#4e4f50] text-white font-semibold text-sm transition-colors"><i class="fa-solid fa-user-plus mr-1"></i> Criar Conta</button>
            </div>
            <input type="text" id="globalToken" placeholder="Token de Acesso" class="w-full p-2 rounded-lg bg-[#18191a] border border-[#3a3b3c] text-xs text-gray-400 focus:outline-none">
        </div>
    </div>

    <!-- Cabeçalho do Perfil -->
    <div id="profile-header" class="bg-[#242526] rounded-xl p-4 shadow-md border border-[#3a3b3c] flex items-center justify-between">
        <div class="flex items-center">
            <div class="relative w-16 h-16 mr-3 flex-shrink-0" id="profileAvatar">
                <img src="https://via.placeholder.com/150" alt="Foto de Perfil" class="w-16 h-16 rounded-full border border-[#3a3b3c] object-cover">
                <button id="btn-updade-photo" class="absolute bottom-0 right-0 w-6 h-6 rounded-full bg-[#00adb5] text-white flex items-center justify-center shadow-md hover:bg-[#008c94] transition-colors">
                    <i class="fa-solid fa-camera text-[10px]"></i>
                </button>
            </div>
            <div>
                <h2 id="profileName" class="text-lg font-semibold text-white">Nome do Usuário</h2>
                <p id="profileEmail" class="text-sm text-gray-400">Email do Usuário</p>            
            </div>
        </div>
    </div>

    <!-- Criar Publicação -->
    <div id="createPostBox" class="bg-[#242526] rounded-xl p-4 shadow-md border border-[#3a3b3c]">
        <div class="flex gap-3 items-center mb-3">
            <div class="w-10 h-10 rounded-full bg-[#00adb5] flex items-center justify-center font-bold text-white shadow-inner" id="myUserAvatar">U</div>
            <input type="text" id="postTitle" placeholder="Título do seu post..." class="flex-1 p-2.5 rounded-full bg-[#3a3b3c] border border-transparent text-sm text-white placeholder-gray-400 focus:outline-none focus:border-[#00adb5]">
        </div>
        <textarea id="postText" rows="2" placeholder="No que você está pensando?" class="w-full p-3 rounded-xl bg-[#242526] border border-[#3a3b3c] text-sm text-white placeholder-gray-400 resize-none focus:outline-none focus:border-[#2d88ff] mb-3"></textarea>
        
        <!-- Zona de Ações da Publicação -->
        <div class="flex justify-between items-center border-t border-[#3a3b3c] pt-3">
            <div>
                <!-- Input de arquivo oculto -->
                <input type="file" id="postFileInput" class="hidden" multiple>
                <button id="btnPostUploadFile" type="button" onclick="document.getElementById('postFileInput').click()" class="p-2 rounded-lg bg-[#3a3b3c] hover:bg-[#4e4f50] text-gray-300 hover:text-white transition-colors text-sm" title="Adicionar arquivos/fotos">
                    <i class="fa-solid fa-paperclip mr-1"></i> Mídia
                </button>
                <span id="fileCountBadge" class="hidden text-xs bg-emerald-600 text-white ml-2 px-2 py-0.5 rounded-full font-medium">0</span>
            </div>
            <button id="btnCreatePost" class="px-5 py-1.5 rounded-lg bg-[#2d88ff] hover:bg-[#1a73e8] text-white font-bold text-sm transition-colors"><i class="fa-solid fa-paper-plane mr-1"></i> Publicar</button>
        </div>
    </div>

    <div id="galery">
        <div id="galeryTarget" class=""></div>
    </div>

    <!-- Controles do Feed -->
    <div class="flex justify-between items-center px-2">
        <h2 class="text-md font-semibold text-gray-400 tracking-wide">Feed Principal</h2>
        <div class="flex items-center gap-2">
            <input type="number" id="feedQtd" value="10" class="w-12 p-1 rounded bg-[#242526] border border-[#3a3b3c] text-xs text-center">
            <button id="btnRefreshFeed" class="text-xs text-[#2d88ff] font-semibold hover:underline"><i class="fa-solid fa-rotate mr-1"></i> Atualizar</button>
        </div>
    </div>

    <!-- Feed Dinâmico -->
    <div id="feedTarget" class="flex flex-col gap-4"></div>

    <!-- Logs -->
    <div class="mt-4 border-t border-[#3a3b3c] pt-4">
        <details class="cursor-pointer text-xs text-gray-500">
            <summary class="hover:text-gray-400">Ver logs do servidor</summary>
            <pre id="output" class="bg-black text-[#0f0] p-3 rounded-lg font-mono text-[11px] max-h-[120px] overflow-y-auto whitespace-pre-wrap mt-2">Aguardando ações...</pre>
        </details>
    </div>
</div>

<!-- ================= POPUP / MODAL DE LOGIN RÁPIDO ================= -->
<div id="modal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-lg shadow-xl w-full max-w-md p-6 flex flex-col max-h-[80vh]">
        <div class="flex justify-between items-center border-b pb-3 mb-4">
            <h2 class="text-xl font-bold text-gray-800">Login Rápido</h2>
            <button onclick="closeModal()" class="text-gray-500 hover:text-gray-700 text-2xl">&times;</button>
        </div>
        <div id="userList" class="overflow-y-auto space-y-2 pr-1 text-gray-900">
            <!-- Usuários entram aqui -->
        </div>
    </div>
</div>

<!-- ================= POPUP / MODAL DE PERFIL COM SCROLL COMPLETO ================= -->
<div id="profileModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex justify-center items-center p-4 hidden">
    <div class="bg-[#242526] w-full max-w-2xl rounded-2xl border border-[#3a3b3c] shadow-2xl flex flex-col max-h-[85vh] overflow-y-auto">
        
        <!-- Conteúdo do Perfil -->
        <div class="p-5 border-b border-[#3a3b3c] relative flex flex-col items-center text-center bg-[#242526]">
            <button id="btnCloseModal" class="absolute top-4 right-4 text-gray-400 hover:text-white text-xl font-bold px-2 transition-colors">&times;</button>
            <div id="modalAvatar" class="w-14 h-14 rounded-full bg-indigo-600 flex items-center justify-center font-bold text-white text-xl shadow-lg mb-2">U</div>
            <h3 id="modalProfileName" class="text-lg font-bold text-white">Nome do Usuário</h3>
            <p id="modalProfileId" class="text-xs text-gray-400 mb-1">ID: 0</p>
            
            <p id="modalProfileBio" class="text-xs text-gray-300 italic max-w-md mb-3 px-4"><i class="fa-solid fa-quote-left text-[10px] text-[#00adb5] mr-1"></i>Carregando biografia...</p>
            
            <!-- Ações Principais -->
            <div class="flex gap-2 mb-3 items-center">
                <button id="btnModalFollow" class="px-4 py-1.5 rounded-full bg-[#2d88ff] hover:bg-[#1a73e8] text-white font-bold text-xs transition-colors"><i class="fa-solid fa-user-plus mr-1"></i> Seguir</button>
                <button id="btnModalUnfollow" class="px-4 py-1.5 rounded-full bg-[#4e4f50] hover:bg-[#3a3b3c] text-white font-bold text-xs transition-colors"><i class="fa-solid fa-user-minus mr-1"></i> Deixar de Seguir</button>
                <button id="btnModalLikeProfile" class="px-4 py-1.5 rounded-full bg-pink-600 hover:bg-pink-700 text-white font-bold text-xs transition-colors" data-liked="false"><i class="fa-solid fa-heart mr-1"></i> <span>Curtir Perfil</span></button>
            </div>

            <!-- Grid de Conexões -->
            <div class="grid grid-cols-4 gap-2 w-full max-w-xl">
                <button id="btnModalAddFriend" class="py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-[11px] transition-colors"><i class="fa-solid fa-user-check mr-1"></i> Add Amizade</button>
                <button id="btnModalRemoveFriend" class="py-1.5 rounded-lg bg-rose-600 hover:bg-rose-700 text-white font-bold text-[11px] transition-colors"><i class="fa-solid fa-user-xmark mr-1"></i> Remover</button>
                <button id="btnModalMatchIn" class="py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-[11px] transition-colors"><i class="fa-solid fa-bullseye mr-1"></i> Match In</button>
                <button id="btnModalMatchOut" class="py-1.5 rounded-lg bg-amber-600 hover:bg-amber-700 text-white font-bold text-[11px] transition-colors"><i class="fa-solid fa-right-from-bracket mr-1"></i> Match Out</button>
            </div>

            <!-- Chat Rápido -->
            <div class="w-full max-w-xl mt-3 pt-3 border-t border-[#3a3b3c]/50 flex gap-2">
                <input type="text" id="modalMsgText" placeholder="Digite uma mensagem direta..." class="flex-1 px-3 py-1.5 text-xs rounded-lg bg-[#18191a] border border-[#3a3b3c] text-white placeholder-gray-400 focus:outline-none focus:border-[#2d88ff]">
                <button id="btnModalSendMsg" class="px-4 py-1.5 rounded-lg bg-[#00adb5] hover:bg-[#008c94] text-white font-bold text-xs transition-colors"><i class="fa-solid fa-paper-plane mr-1"></i> Enviar</button>
                <button id="btnModalLikeMsg" class="px-3 py-1.5 rounded-lg bg-purple-600 hover:bg-purple-700 text-white font-bold text-xs transition-colors" data-liked="false"><i class="fa-solid fa-heart-pulse"></i></button>
            </div>
        </div>
        
        <!-- Área das Publicações -->
        <div id="modalFeedTarget" class="p-4 flex flex-col gap-4 bg-[#18191a]"></div>
    </div>
</div>

<!-- ================= MODAL DE CONFIGURAÇÃO DE ENDPOINTS ================= -->
<div id="settingsModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex justify-center items-center p-4 hidden">
    <div class="bg-[#242526] w-full max-w-lg rounded-2xl border border-[#3a3b3c] shadow-2xl flex flex-col max-h-[85vh]">
        <div class="p-4 border-b border-[#3a3b3c] flex justify-between items-center">
            <h3 class="text-md font-bold text-white"><i class="fa-solid fa-gear text-[#00adb5] mr-2"></i>Configuração de Endpoints</h3>
            <button id="btnCloseSettings" class="text-gray-400 hover:text-white text-xl font-bold px-2 transition-colors">&times;</button>
        </div>
        <div class="p-4 overflow-y-auto flex flex-col gap-3 text-xs">
            <div>
                <label class="block text-gray-400 mb-1 font-semibold">Sign In</label>
                <input type="text" id="epSignIn" value="/api/auth/signin" class="w-full p-2 rounded bg-[#18191a] border border-[#3a3b3c] text-white focus:outline-none focus:border-[#00adb5]">
            </div>
            <div>
                <label class="block text-gray-400 mb-1 font-semibold">Sign Up</label>
                <input type="text" id="epSignUp" value="/api/auth/signup" class="w-full p-2 rounded bg-[#18191a] border border-[#3a3b3c] text-white focus:outline-none focus:border-[#00adb5]">
            </div>
            <div>
                <label class="block text-gray-400 mb-1 font-semibold">Feed / Post (GET, POST, DELETE)</label>
                <input type="text" id="epFeed" value="/api/feed" class="w-full p-2 rounded bg-[#18191a] border border-[#3a3b3c] text-white focus:outline-none focus:border-[#00adb5]">
            </div>
            <div>
                <label class="block text-gray-400 mb-1 font-semibold">Comentários (POST, DELETE)</label>
                <input type="text" id="epComment" value="/api/comment/feed" class="w-full p-2 rounded bg-[#18191a] border border-[#3a3b3c] text-white focus:outline-none focus:border-[#00adb5]">
            </div>
            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block text-gray-400 mb-1 font-semibold">Seguir</label>
                    <input type="text" id="epFollow" value="/api/social/follow" class="w-full p-2 rounded bg-[#18191a] border border-[#3a3b3c] text-white focus:outline-none focus:border-[#00adb5]">
                </div>
                <div>
                    <label class="block text-gray-400 mb-1 font-semibold">Deixar de Seguir</label>
                    <input type="text" id="epUnfollow" value="/api/social/unfollow" class="w-full p-2 rounded bg-[#18191a] border border-[#3a3b3c] text-white focus:outline-none focus:border-[#00adb5]">
                </div>
            </div>
            <div>
                <label class="block text-gray-400 mb-1 font-semibold">Curtir Perfil</label>
                <input type="text" id="epLikeProfile" value="/api/like/profile" class="w-full p-2 rounded bg-[#18191a] border border-[#3a3b3c] text-white focus:outline-none focus:border-[#00adb5]">
            </div>
            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block text-gray-400 mb-1 font-semibold">Adicionar Amigo</label>
                    <input type="text" id="epAddFriend" value="/api/friend/add" class="w-full p-2 rounded bg-[#18191a] border border-[#3a3b3c] text-white focus:outline-none focus:border-[#00adb5]">
                </div>
                <div>
                    <label class="block text-gray-400 mb-1 font-semibold">Remover Amigo</label>
                    <input type="text" id="epRemoveFriend" value="/api/friend/remove" class="w-full p-2 rounded bg-[#18191a] border border-[#3a3b3c] text-white focus:outline-none focus:border-[#00adb5]">
                </div>
            </div>
            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block text-gray-400 mb-1 font-semibold">Match In</label>
                    <input type="text" id="epMatchIn" value="/api/match/in" class="w-full p-2 rounded bg-[#18191a] border border-[#3a3b3c] text-white focus:outline-none focus:border-[#00adb5]">
                </div>
                <div>
                    <label class="block text-gray-400 mb-1 font-semibold">Match Out</label>
                    <input type="text" id="epMatchOut" value="/api/match/out" class="w-full p-2 rounded bg-[#18191a] border border-[#3a3b3c] text-white focus:outline-none focus:border-[#00adb5]">
                </div>
            </div>
            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block text-gray-400 mb-1 font-semibold">Enviar Mensagem</label>
                    <input type="text" id="epSendMsg" value="/api/message/send" class="w-full p-2 rounded bg-[#18191a] border border-[#3a3b3c] text-white focus:outline-none focus:border-[#00adb5]">
                </div>
                <div>
                    <label class="block text-gray-400 mb-1 font-semibold">Curtir Mensagem</label>
                    <input type="text" id="epLikeMsg" value="/api/like/message" class="w-full p-2 rounded bg-[#18191a] border border-[#3a3b3c] text-white focus:outline-none focus:border-[#00adb5]">
                </div>
            </div>
            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block text-gray-400 mb-1 font-semibold">Curtir Post</label>
                    <input type="text" id="epLikePost" value="/api/like/post" class="w-full p-2 rounded bg-[#18191a] border border-[#3a3b3c] text-white focus:outline-none focus:border-[#00adb5]">
                </div>
                <div>
                    <label class="block text-gray-400 mb-1 font-semibold">Curtir Comentário</label>
                    <input type="text" id="epLikeComment" value="/api/like/comment" class="w-full p-2 rounded bg-[#18191a] border border-[#3a3b3c] text-white focus:outline-none focus:border-[#00adb5]">
                </div>
            </div>
        </div>
        <div class="p-3 border-t border-[#3a3b3c] flex justify-end">
            <button id="btnSaveSettings" class="px-4 py-1.5 rounded-lg bg-[#00adb5] hover:bg-[#008c94] text-white font-bold transition-colors">Salvar e Fechar</button>
        </div>
    </div>
</div>

<template id="postTemplate">
    <div class="bg-[#242526] rounded-xl shadow-md border border-[#3a3b3c] flex flex-col overflow-hidden text-left w-full shrink-0">
        <div class="p-3 flex items-center justify-between border-b border-[#3a3b3c]/50">
            <div class="flex items-center gap-2.5 cursor-pointer open-profile-btn">
                <div class="avatar w-8 h-8 rounded-full bg-emerald-600 flex items-center justify-center font-bold text-white text-xs"></div>
                <span class="author-name text-sm font-semibold text-white hover:underline"></span>
            </div>
            <button class="btn-delete-post hidden text-gray-500 hover:text-rose-500 p-1.5 rounded-lg transition-colors">
                <i class="fa-solid fa-trash text-xs"></i>
            </button>
        </div>
        <div class="px-4 pt-3 pb-2">
            <div class="post-title text-md font-bold text-white mb-1 hidden"></div>
            <div class="post-text text-sm text-gray-200 leading-relaxed"></div>
        </div>
        <div class="photos-container px-4 pb-3 flex gap-2 overflow-x-auto snap-x scrollbar-hide hidden"></div>
        <div class="px-4 pb-2 flex justify-between border-b border-[#3a3b3c]/30">
            <button class="btn-like-post text-xs font-bold transition-colors py-1 flex items-center gap-1 text-gray-400 hover:text-pink-500">
                <i class="fa-solid fa-heart"></i> <span class="label">Curtir</span>
            </button>
            <span class="likes-count text-xs text-gray-400 py-1">0 curtidas</span>
        </div>
        <div class="bg-[#1c1d1e] p-3 flex flex-col gap-2">
            <div class="comments-list space-y-2 max-h-36 overflow-y-auto pr-1"></div>
            <div class="flex gap-2 mt-1">
                <input type="text" placeholder="Comentar..." class="comment-input-field flex-1 px-3 py-1.5 text-xs rounded-full bg-[#3a3b3c] text-white focus:outline-none">
                <button class="btn-submit-comment px-4 py-1.5 text-xs rounded-full bg-[#2d88ff] text-white font-bold transition-colors">Enviar</button>
            </div>
        </div>
    </div>
</template>

<script src="/static/scripts/home/home.js"></script>
<script src="/static/scripts/home/profileUser.js"></script>

<!-- Script para gerenciar a contagem visual de arquivos selecionados -->
<script>
    document.getElementById('postFileInput').addEventListener('change', function() {
        const badge = document.getElementById('fileCountBadge');
        const filesCount = this.files.length;
        if (filesCount > 0) {
            badge.textContent = filesCount;
            badge.classList.remove('hidden');
        } else {
            badge.classList.add('hidden');
        }
    });
</script>

</body>
</html>
