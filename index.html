<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      .entity::before {
        content: "👤";
      }
    </style>
  </head>
  <body class="bg-gray-900 text-white font-mono antialiased min-h-screen">
    <div id="grid" class="grid grid-cols-[repeat(20,32px)] grid-rows-[repeat(20,32px)] gap-1 m-5"></div>
    <script>
      const GRID_SIZE = 20;

      const grid = document.getElementById("grid");

      for (let i = 0; i < GRID_SIZE * GRID_SIZE; i++) {
        const cell = document.createElement("div");
        cell.className = "w-8 h-8 bg-gray-800 flex items-center justify-center";
        cell.id = `cell-${i}`;
        grid.appendChild(cell);
      }

      const entities = {};

      const ws = new WebSocket("ws://localhost:3000");

      document.addEventListener("keypress", (e) => {
        if (e.keyCode == 37) {
          ws.send(JSON.stringify({ type: "move", direction: "left" }));
        }
        if (e.keyCode == 38) {
          ws.send(JSON.stringify({ type: "move", direction: "up" }));
        }
        if (e.keyCode == 39) {
          ws.send(JSON.stringify({ type: "move", direction: "right" }));
        }
        if (e.keyCode == 40) {
          ws.send(JSON.stringify({ type: "move", direction: "down" }));
        }
      });

      ws.onopen = () => {
        console.log("Conectado");
      };
      let debgOk = false;
      ws.onmessage = (event) => {
        let msg;
        try {
          msg = JSON.parse(event.data);
        } catch {
          console.error("Mensagem inválida");
          console.error(event);
          return;
        }

        if (msg.type === "spawn") {
          entities[msg.netId] = { id: msg.netId, name: msg.name, pos: { x: 0, y: 0, z: 0 } };
          render();
          return;
        }

        if (msg.type === "despawn") {
          delete entities[msg.netId];
          render();
          return;
        }

        if (msg.type === "sync") {
          const pl = msg.payload;
          const entity = entities[pl.netId];
          if (!entity) {
            if (!debgOk) { console.log(msg); debgOk = true; }
            return;
          }
          debgOk = false;
          if (pl.type === "tr") {
            if (pl.px != null) entity.pos.x = pl.px;
            if (pl.py != null) entity.pos.y = pl.py;
          }
          render();
          return;
        }

        console.error("Mensagem inválida");
        console.error(msg);
      };

      function render() {
        document.querySelectorAll(".entity").forEach(e => e.remove());
        Object.values(entities).forEach(entity => {
          const x = Math.floor(entity.pos.x);
          const y = Math.floor(entity.pos.y);
          const gridX = ((x % GRID_SIZE) + GRID_SIZE) % GRID_SIZE;
          const gridY = ((y % GRID_SIZE) + GRID_SIZE) % GRID_SIZE;
          const index = gridY * GRID_SIZE + gridX;
          const cell = document.getElementById(`cell-${index}`);
          if (!cell) return;
          const el = document.createElement("span");
          el.className = "entity";
          el.id = entity.id;
          cell.appendChild(el);
        });
      }
    </script>
  </body>
</html>
