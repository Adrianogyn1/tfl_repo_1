<div>
    <h5>Informações</h5>
    <div>
        <label id="lbl_name">Name</label>
        <input type="text" id="userName" value=""
            class="w-full p-2 rounded bg-[#18191a] border border-[#3a3b3c] text-white focus:outline-none focus:border-[#00adb5]">
    </div>

    <div>
        <label id="lbl_email">Email</label>
        <input type="email" id="userEmail" value=""
            class="w-full p-2 rounded bg-[#18191a] border border-[#3a3b3c] text-white focus:outline-none focus:border-[#00adb5]">
    </div>
</div>
<!--avatar-->
<div>
    <h5>Avatar</h5>
    <div id="avatar"></div>
</div>


<script>
    const id = new URLSearchParams(window.location.search).get('id');
    const dominio = window.location.origin.endsWith("/") ? window.location.origin.slice(0, -1) : window.location.origin;
    const result = await fetch(`${dominio}/api/user/${id}`).then(res => res.json());
    function renderUser(result)
    {
        var user = result.data;
        $('#userName').val(user.name);
        $('#userEmail').val(user.email);
    } (result);

</script>
